<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar · CIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--side:#fafafa;--txt:#18181b;--sub:#71717a;--line:#e4e4e7;--chip:#f4f4f5;--acc:#18181b;--ok:#16a34a;--bad:#dc2626;
  --g1:#f0fdf4;--g2:#dcfce7;--g3:#bbf7d0;--g4:#86efac;--r1:#fef2f2;--blue:#2563eb;--bar:#a5b4fc}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--txt);background:var(--bg)}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;min-height:100vh}
aside{width:240px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:1px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;font-weight:600;font-size:13px}
.marca i{width:22px;height:22px;border-radius:6px;background:#c7d2fe;color:#3730a3;display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.marca span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:7px;color:#3f3f46;cursor:pointer;font-size:13px;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:#f0f0f1}.nav.on{background:#ececee;font-weight:600;color:var(--txt)}
.nav .e{width:18px;text-align:center;flex:none}
.nav small{margin-left:auto;font-size:10.5px;color:var(--sub);background:var(--chip);border-radius:9px;padding:1px 6px}
.grupo{font-size:12px;color:var(--sub);padding:14px 10px 4px}
.pie{margin-top:auto;padding:10px 8px 2px;font-size:12px;color:var(--sub);border-top:1px solid var(--line)}
main{flex:1;min-width:0}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top .t{font-size:14px}.top .sp{flex:1}.top .muted{font-size:12px;color:var(--sub)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:#f7f7f8}.btn.neg{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.hambur{display:none}
.cuerpo{padding:28px 28px 60px;max-width:1500px}
h1{font-size:26px;margin:6px 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:30px 0 6px}
.desc{color:var(--sub);margin:0 0 18px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative}
.chip b{font-weight:600}.chip.gris{background:var(--chip);cursor:default}
.chip select{border:0;background:transparent;font-weight:600;cursor:pointer;padding:0;appearance:none;-webkit-appearance:none}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:6px;z-index:20;min-width:210px;display:none;max-height:360px;overflow:auto}
.menu.on{display:block}
.menu label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.menu label:hover{background:var(--chip)}
.caja{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.barra .sp{flex:1}
.vistas{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vistas button{border:0;background:#fff;padding:6px 9px;cursor:pointer;line-height:0}
.vistas button.on{background:var(--chip)}
.buscar{border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:210px;font-size:13px}
.scroll{overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap}
th{position:sticky;top:0;background:#fff;z-index:2;text-align:left;font-weight:500;color:var(--sub);padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
th.ord{color:var(--txt);font-weight:600}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;z-index:1}
th:first-child{z-index:3}
td{padding:9px 12px;border-bottom:1px solid #f1f1f3;font-variant-numeric:tabular-nums}
tr:hover td,tr:hover td:first-child{background:#fafafa}
.crea{display:flex;align-items:center;gap:10px;min-width:260px;max-width:340px;cursor:pointer}
.mini{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--chip);flex:none}
.crea .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.crea .s{font-size:11.5px;color:var(--sub);display:flex;gap:6px;align-items:center}
.texto{max-width:420px;white-space:normal;line-height:1.35}
.pill{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--chip);color:#3f3f46;font-weight:500;white-space:nowrap}
.pill.test{background:#dbeafe;color:#1d4ed8}.pill.esc{background:#dcfce7;color:#15803d}.pill.baja{background:#fee2e2;color:#b91c1c}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:#3f3f46;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mas{font-size:11px;color:var(--sub);margin-left:4px}
.verde1{background:var(--g1)!important}.verde2{background:var(--g2)!important}.verde3{background:var(--g3)!important}.verde4{background:var(--g4)!important}
.rojo{background:var(--r1)!important;color:#991b1b}
.sube{color:var(--ok);font-weight:500}.cae{color:var(--bad);font-weight:500}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:14px}
.tar{border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:box-shadow .15s}
.tar:hover{box-shadow:0 6px 24px rgba(0,0,0,.07)}
.tar .img{aspect-ratio:4/5;background:var(--chip) center/cover no-repeat;position:relative}
.tar .fmt{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:6px;padding:2px 7px}
.tar .st{position:absolute;top:8px;right:8px}
.tar .info{padding:10px 12px}
.tar .n{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tar .met{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:9px 0}
.tar .met div{font-size:11.5px;color:var(--sub);border-radius:6px;padding:2px 4px}.tar .met b{display:block;font-size:14px;color:var(--txt)}
.tar .tags{display:flex;flex-wrap:wrap;gap:4px}
.vacio{padding:50px 20px;text-align:center;color:var(--sub)}
.centro{max-width:520px;margin:9vh auto;padding:0 16px;text-align:center}
.centro h1{font-size:28px}.centro p{color:var(--sub)}
.fb{background:#1877f2;border-color:#1877f2;color:#fff;font-size:15px;padding:11px 20px;border-radius:10px}
.pasos{text-align:left;margin:26px auto 0;max-width:420px;color:#3f3f46;font-size:13.5px}
.pasos li{margin:6px 0}
.cuentas{display:flex;flex-direction:column;gap:8px;margin-top:20px;text-align:left}
.cuentas button{text-align:left;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50}
.panel.on{display:block}
.hoja{position:absolute;right:0;top:0;bottom:0;width:min(580px,100%);background:#fff;overflow:auto;padding:22px}
.hoja img{width:100%;border-radius:10px;background:var(--chip)}
.hoja h2{font-size:18px;margin:14px 0 4px;word-break:break-word}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--sub);background:#fff}
.kpi b{display:block;font-size:20px;color:var(--txt);margin:2px 0;letter-spacing:-.01em}
.kpi small{font-size:12px}
.puntajes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.punt{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:11.5px;color:var(--sub)}
.punt b{display:block;font-size:20px;color:var(--txt)}
.copy{white-space:pre-wrap;background:var(--side);border-radius:10px;padding:12px;font-size:13px;color:#3f3f46}
.cerrar{float:right}
.aviso{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.box h3{margin:0 0 10px;font-size:14px}
.fila{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f1f3;cursor:pointer}
.fila:last-child{border-bottom:0}
.fila .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.fila .v{font-size:12.5px;color:var(--sub);text-align:right;white-space:nowrap}
.rank{width:22px;text-align:center;font-weight:600;color:var(--sub)}
.mov{width:30px;font-size:11.5px;text-align:center}
.atajos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.atajo{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff}
.atajo:hover{box-shadow:0 4px 18px rgba(0,0,0,.06)}
.atajo div{font-size:22px}.atajo b{display:block;margin-top:6px;font-size:13px}
.leyenda{font-size:12px;color:var(--sub);display:flex;gap:14px;margin-top:6px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.barrita{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;min-width:80px}
.barrita i{display:block;height:100%;background:#818cf8}
.sugerencia{font-size:12.5px;color:#3f3f46;background:var(--side);border-radius:8px;padding:6px 10px;margin-top:6px}
.matriz td,.matriz th{text-align:center;font-size:12px;padding:7px 9px}
.matriz th:first-child,.matriz td:first-child{text-align:left}
@media (max-width:900px){
  aside{position:fixed;left:-270px;z-index:40;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.1)}
  aside.on{left:0}
  .hambur{display:inline-flex}
  .cuerpo{padding:18px 16px 50px}
  .top{padding:0 12px}.top .muted{display:none}
  .buscar{width:100%}
  .scroll{max-height:none}
  .grid2{grid-template-columns:1fr}
  .tarjetas{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}
}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const FN = "https://us-central1-cleargy-creators.cloudfunctions.net/radar";
const q = new URLSearchParams(location.search);
const MARCA = (q.get("m") || "").toLowerCase(), K = q.get("k") || "", DEMO = q.get("demo") === "1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const guardar = (k, v) => { try { localStorage.setItem("radar_" + k, JSON.stringify(v)); } catch (_) {} };
const leer = (k, d) => { try { const v = localStorage.getItem("radar_" + k); return v ? JSON.parse(v) : d; } catch (_) { return d; } };

const PRESETS = { last_7d: "Últimos 7 días", last_14d: "Últimos 14 días", last_30d: "Últimos 30 días", last_90d: "Últimos 90 días" };
const DIAS = { last_7d: 7, last_14d: 14, last_30d: 30, last_90d: 90 };
const FORMATOS = { video: "Video", imagen: "Imagen", carrusel: "Carrusel", flexible: "Flexible", post: "Post", catalogo: "Catálogo", otro: "Otro" };
const pct = v => v == null ? "—" : fmtN(v, 2) + " %";
const METRICAS = {
  roas: { n: "ROAS", f: v => v == null ? "—" : fmtN(v, 2) + "×" },
  spend: { n: "Gasto", f: v => fmtM(v) },
  purchase_value: { n: "Facturación", f: v => fmtM(v) },
  purchases: { n: "Compras", f: v => fmtN(v, 0) },
  cpa: { n: "CPA", f: v => fmtM(v), menor: true },
  aov: { n: "Ticket promedio", f: v => fmtM(v) },
  ctr_link: { n: "CTR (enlace)", f: pct },
  cpc_link: { n: "CPC (enlace)", f: v => fmtM(v), menor: true },
  clicks: { n: "Clics", f: v => fmtN(v, 0) },
  cpm: { n: "CPM", f: v => fmtM(v), menor: true },
  impressions: { n: "Impresiones", f: v => fmtN(v, 0) },
  frecuencia: { n: "Frecuencia", f: v => v == null ? "—" : fmtN(v, 2) },
  hook_rate: { n: "Hook rate", f: pct, d: "Vistas de 3 s / impresiones" },
  hold_rate: { n: "Retención", f: pct, d: "ThruPlay / vistas de 3 s" },
  r25: { n: "Ve 25 %", f: pct }, r50: { n: "Ve 50 %", f: pct }, r75: { n: "Ve 75 %", f: pct }, r100: { n: "Ve 100 %", f: pct },
  atc: { n: "Carritos", f: v => fmtN(v, 0) },
  costo_atc: { n: "Costo por carrito", f: v => fmtM(v), menor: true },
  ic: { n: "Checkouts", f: v => fmtN(v, 0) },
  conv_clic: { n: "Compra / clic", f: pct },
  seg: { n: "Duración", f: v => v == null ? "—" : v + " s" },
};
const TAGS = { tipo_pieza: "Tipo de pieza", formato_visual: "Formato visual", tema_mensaje: "Tema de mensaje", tactica_hook: "Táctica de hook",
  tactica_titular: "Táctica de titular", publico: "Público", estacionalidad: "Estacionalidad", tipo_oferta: "Tipo de oferta",
  quien_habla: "Quién habla", angulo: "Ángulo", nivel_conciencia: "Nivel de conciencia" };
const TAGS_TARJETA = ["formato_visual", "tema_mensaje", "publico"];

// Reportes: mismas pantallas que Radar. g = agrupar por; f = filtro; o = orden; m = métricas
const BASE = ["roas", "spend", "purchase_value", "purchases", "ctr_link", "cpc_link", "cpa", "impressions", "aov"];
const REPORTES = {
  mejores: { e: "🏆", t: "Mejores creativos", d: "Tus creativos con mejor rendimiento, para ver rápido qué está funcionando.", o: "roas", m: BASE },
  activos: { e: "🟢", t: "Anuncios activos", d: "Lo que está prendido hoy y cómo viene en el período.", f: x => x.activos > 0, o: "spend", m: BASE },
  lanzamientos: { e: "🚀", t: "Lanzamientos nuevos", d: "Lo que salió en el período y cómo le está yendo. Abajo, la tasa de acierto de cada semana.", lanz: true, o: "lanzado", m: BASE },
  hooks: { e: "🪝", t: "Mejores hooks", d: "Videos que más frenan el scroll: vistas de 3 segundos sobre impresiones.", f: x => x.formato === "video" || x.v3 > 0, o: "hook_rate", m: ["hook_rate", "hold_rate", "ctr_link", "spend", "roas", "impressions"], hook: true },
  clics: { e: "👆", t: "Más clics", d: "Los creativos que más mandan gente a la tienda.", o: "ctr_link", m: ["ctr_link", "cpc_link", "clicks", "spend", "roas", "conv_clic"] },
  copies: { e: "🖋️", t: "Mejores copies", d: "El mismo texto en distintos creativos, sumado.", g: x => (x.copy || "").trim().slice(0, 160) || "(sin texto)", gn: "Copy", o: "roas", m: ["roas", "spend", "purchases", "ctr_link", "cpa"] },
  tipos: { e: "📊", t: "Tipos de anuncio", d: "Video, imagen, carrusel, flexible: cuál rinde mejor en tu cuenta.", g: x => FORMATOS[x.formato] || x.formato, gn: "Tipo", o: "spend", m: ["spend", "roas", "purchases", "cpa", "ctr_link", "cpm"] },
  landings: { e: "🛬", t: "Análisis de landings", d: "A qué página manda cada anuncio y cuánto vende cada una.", g: x => x.link || "(sin link)", gn: "Landing", o: "spend", m: ["spend", "roas", "purchases", "conv_clic", "ctr_link", "costo_atc"] },
  videos: { e: "📽️", t: "Análisis de videos", d: "Cuánto enganchan y hasta dónde los miran.", f: x => x.formato === "video" || x.v3 > 0, o: "spend", m: ["spend", "roas", "hook_rate", "hold_rate", "r25", "r50", "r75", "r100", "ctr_link"] },
  estaticos: { e: "📸", t: "Análisis de estáticos", d: "Imágenes y carruseles.", f: x => ["imagen", "carrusel"].includes(x.formato) || (x.formato === "flexible" && !x.v3), o: "roas", m: ["roas", "spend", "ctr_link", "cpc_link", "cpa", "cpm"] },
  duracion: { e: "⏳", t: "Duración de videos", d: "¿Rinden mejor los cortos o los largos?", f: x => x.formato === "video", g: x => tramo(x.seg), gn: "Duración", o: "orden", m: ["spend", "roas", "hook_rate", "hold_rate", "ctr_link", "cpa"] },
  tendencia: { e: "📅", t: "Tendencia semanal", d: "Gasto, ROAS y CPA de la cuenta semana a semana.", especial: "tendencia" },
};
const PATRONES = Object.fromEntries(["tipo_pieza", "formato_visual", "tema_mensaje", "tactica_hook", "tactica_titular", "publico", "estacionalidad", "tipo_oferta", "quien_habla", "angulo", "nivel_conciencia"]
  .map(k => [k, { e: { tipo_pieza: "🖼️", formato_visual: "📐", tema_mensaje: "💬", tactica_hook: "🪝", tactica_titular: "📰", publico: "👥", estacionalidad: "🗓️", tipo_oferta: "🤑", quien_habla: "🎙️", angulo: "🧭", nivel_conciencia: "🧠" }[k], t: TAGS[k] }]));
function tramo(s) { if (s == null) return "Sin dato"; return s < 15 ? "0-15 s" : s < 30 ? "15-30 s" : s < 45 ? "30-45 s" : s < 60 ? "45-60 s" : "60 s o más"; }

let est = {
  pantalla: leer("pantalla", "home"), preset: leer("preset", "last_14d"), vista: leer("vista", "tabla"),
  formatos: leer("formatos", ["video", "imagen", "carrusel", "flexible", "post", "otro"]),
  metricasExtra: leer("metricasExtra", {}), orden: null, buscar: "", minGasto: leer("minGasto", 0),
  conexion: null, datos: null, cache: {},
};
function fmtN(v, d) { return Number(v || 0).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtM(v) { if (v == null || !isFinite(v)) return "—"; return "$ " + fmtN(v, Math.abs(v) >= 1000 ? 0 : 2); }
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sept", "oct", "nov", "dic"];
function fecha(iso) { if (!iso) return "—"; const d = new Date(iso); return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; }
function fechaCorta(iso) { const d = new Date(iso + (iso.length === 10 ? "T12:00" : "")); return `${d.getDate()} ${MESES[d.getMonth()]}`; }
function hace(ms) { if (!ms) return "nunca"; const m = Math.round((Date.now() - ms) / 60000); if (m < 2) return "este minuto"; if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); return h < 24 ? `hace ${h} h` : `hace ${Math.round(h / 24)} días`; }
function delta(a, b, menor) {
  if (b == null || !isFinite(b) || b === 0 || a == null) return "";
  const d = (a - b) / Math.abs(b) * 100, bien = menor ? d < 0 : d > 0;
  return `<span class="${Math.abs(d) < 0.5 ? "" : bien ? "sube" : "cae"}">${d > 0 ? "+" : ""}${fmtN(d, Math.abs(d) >= 100 ? 0 : 1)} %</span>`;
}
async function api(accion, extra) {
  const u = new URL(FN); u.searchParams.set("accion", accion); u.searchParams.set("marca", MARCA); u.searchParams.set("k", K);
  for (const [a, b] of Object.entries(extra || {})) u.searchParams.set(a, b);
  const r = await fetch(u); const j = await r.json().catch(() => ({ ok: false, error: "respuesta rara" }));
  if (!j.ok) throw new Error(j.error || "error");
  return j;
}

// ── métricas derivadas, estado y puntajes ──────────────────────────
const div = (a, b) => b > 0 ? a / b : null;
function calcular(x) {
  x.purchase_value = x.value;
  x.roas = div(x.value, x.spend); x.cpa = div(x.spend, x.purchases); x.aov = div(x.value, x.purchases);
  x.ctr_link = div(x.clicks, x.impressions) == null ? null : x.clicks / x.impressions * 100;
  x.cpc_link = div(x.spend, x.clicks); x.cpm = x.impressions ? x.spend / x.impressions * 1000 : null;
  x.frecuencia = div(x.impressions, x.reach);
  x.hook_rate = x.v3 && x.impressions ? x.v3 / x.impressions * 100 : null;
  x.hold_rate = x.v3 ? x.thru / x.v3 * 100 : null;
  for (const p of [25, 50, 75, 100]) x["r" + p] = x.v3 ? x["p" + p] / x.v3 * 100 : null;
  x.costo_atc = div(x.spend, x.atc); x.conv_clic = x.clicks ? x.purchases / x.clicks * 100 : null;
  return x;
}
function derivar(filas) {
  const be = est.conexion?.breakEven || 2, total = filas.reduce((s, f) => s + f.spend, 0) || 1;
  const out = filas.map(f => calcular(Object.assign({}, f)));
  for (const x of out) {
    const dias = x.lanzado ? (Date.now() - new Date(x.lanzado)) / 864e5 : 99, share = x.spend / total;
    const sube = x.prev && x.prev.spend ? (x.spend - x.prev.spend) / x.prev.spend : null;
    x.share = share;
    x.estado = dias < 7 ? ["Testing", "test"]
      : share < 0.01 ? ["Low impact", ""]
      : (x.roas || 0) >= be && (sube == null || sube > 0.2) && share >= 0.03 ? ["Escalando", "esc"]
      : (x.roas || 0) < be * 0.7 && share >= 0.03 ? ["Bajando", "baja"] : ["Estable", ""];
  }
  // Puntajes 0-100 por percentil dentro de la cuenta (como Radar: Hook / Watch / Click / Convert)
  const conMuestra = out.filter(x => x.impressions >= 1000);
  for (const [k, m] of [["sHook", "hook_rate"], ["sWatch", "hold_rate"], ["sClick", "ctr_link"], ["sConvert", "roas"]]) {
    const vals = conMuestra.map(x => x[m]).filter(v => v != null).sort((a, b) => a - b);
    for (const x of out) x[k] = x[m] == null || vals.length < 3 || x.impressions < 1000 ? null : Math.round(vals.filter(v => v <= x[m]).length / vals.length * 100);
  }
  return out;
}
function sugerencia(x) {
  const be = est.conexion?.breakEven || 2;
  if (x.sHook >= 70 && x.sWatch != null && x.sWatch <= 30) return "Engancha pero se van antes: rehacé el cuerpo y dejá el hook.";
  if (x.sHook != null && x.sHook <= 30 && x.sConvert >= 60) return "Vende bien pero engancha poco: probá hooks nuevos con este mismo cuerpo.";
  if (x.sClick >= 70 && (x.roas || 0) < be) return "Hacen clic pero no compran: revisá la landing o la oferta.";
  if ((x.roas || 0) >= be * 1.4 && x.share < 0.05 && x.spend > 0) return "Rinde muy arriba del break-even y gasta poco: subile presupuesto.";
  if ((x.roas || 0) < be * 0.6 && x.share >= 0.1) return "Se lleva mucho gasto y queda debajo del break-even: bajalo o apagalo.";
  return "";
}
function sombra(m, v, fs) {
  if (v == null) return "";
  const be = est.conexion?.breakEven || 2;
  if (m === "roas") { if (v < be) return "rojo"; return v >= be * 2 ? "verde4" : v >= be * 1.5 ? "verde3" : v >= be * 1.2 ? "verde2" : "verde1"; }
  if (!METRICAS[m] || ["spend", "impressions", "seg", "clicks", "purchases", "atc", "ic"].includes(m)) return "";
  const vals = fs.map(f => f[m]).filter(x => x != null).sort((a, b) => a - b);
  if (vals.length < 5) return "";
  const p = vals.filter(x => x <= v).length / vals.length, top = METRICAS[m].menor ? 1 - p : p;
  return top >= .9 ? "verde3" : top >= .75 ? "verde2" : top >= .6 ? "verde1" : "";
}
function sumar(lista) {
  const t = { spend: 0, value: 0, purchases: 0, impressions: 0, reach: 0, clicks: 0, atc: 0, ic: 0, v3: 0, thru: 0, p25: 0, p50: 0, p75: 0, p100: 0 };
  for (const x of lista) for (const k in t) t[k] += x[k] || 0;
  return calcular(t);
}
function base() {
  if (!est.datos) return [];
  return derivar(est.datos.filas).filter(f => est.formatos.includes(f.formato) && f.spend >= est.minGasto);
}

// ── agrupar (temas, copies, tipos, landings, patrones) ─────────────
function agruparPor(fs, fnClave) {
  const be = est.conexion?.breakEven || 2, total = fs.reduce((s, x) => s + x.spend, 0) || 1, g = {};
  for (const x of fs) { const c = fnClave(x) || "(sin etiqueta)"; (g[c] = g[c] || []).push(x); }
  return Object.entries(g).map(([clave, l]) => Object.assign(sumar(l), {
    clave, items: l.sort((a, b) => b.spend - a.spend), n: l.length, share: l.reduce((s, x) => s + x.spend, 0) / total,
    acierto: l.filter(x => (x.roas || 0) >= be && x.spend > 0).length / l.length,
  }));
}
function tablaGrupos(grupos, nombreCol, metricas, totalCuenta) {

  const th = (k, n) => `<th class="num ${est.orden?.m === k ? "ord" : ""}" onclick="ordenarG('${k}')">${n}${est.orden?.m === k ? (est.orden.dir === "desc" ? " ↓" : " ↑") : ""}</th>`;
  return `<div class="caja"><div class="scroll"><table><thead><tr><th>${nombreCol}</th><th class="num">Creativos</th><th>Peso en el gasto</th>${metricas.map(m => th(m, METRICAS[m].n)).join("")}<th class="num">Acierto</th>${totalCuenta ? "<th class='num'>ROAS vs. cuenta</th>" : ""}</tr></thead><tbody>
  ${grupos.map((g, i) => `<tr><td><div class="crea texto" style="max-width:420px" onclick="verGrupo(${i})"><div style="display:flex;margin-right:4px">${g.items.slice(0, 3).map(x => `<img class="mini" style="width:30px;height:30px;margin-right:-8px;border:2px solid #fff" src="${esc(x.mini)}" onerror="this.style.visibility='hidden'">`).join("")}</div><span style="margin-left:10px">${esc(g.clave)}</span></div></td>
    <td class="num">${g.n}</td><td><div class="barrita"><i style="width:${Math.max(2, g.share * 100)}%"></i></div><span class="mas">${fmtN(g.share * 100, 0)} %</span></td>
    ${metricas.map(m => `<td class="num ${sombra(m, g[m], grupos)}">${METRICAS[m].f(g[m])}</td>`).join("")}
    <td class="num">${fmtN(g.acierto * 100, 0)} %</td>${totalCuenta ? `<td class="num">${delta(g.roas, totalCuenta.roas)}</td>` : ""}</tr>`).join("")}
  </tbody></table></div></div>`;
}
function ordenarGrupos(gs, def) {

// Launch analysis: lanzados por semana → escalaron → ganadores (con los 90 días, que cubren la vida del creativo)
