<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Edición del día · CIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif}
:root{--bg:#FAF7F4;--card:#FFFFFF;--soft:#F6F2EE;--line:#EFE8E3;--line2:#E2D8D1;--txt:#26211E;--mut:#8A7E77;--mut2:#B5A79F;
  --ok:#3F8F6B;--ok-bg:#E7F2EC;--warn:#B07B2E;--warn-bg:#F7EEDD;--bad:#C1613C;--bad-bg:#F8E7DF;--r:22px}
body{background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 22px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:10px 17px;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--line2)}
.btn.dark{background:var(--txt);color:#fff;border-color:var(--txt)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{color:var(--bad)}
.btn:disabled{background:var(--soft);color:var(--mut2);border-color:var(--line);cursor:default}
.marcas{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.mt{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:13px;padding:8px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.mt.on{background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(38,33,30,.08)}
.mt b{display:inline-block;margin-left:7px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600}
.top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:11px;margin-bottom:18px}
@media (max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
.hero{border-radius:26px;padding:22px 24px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#51463F 0%,#26211E 64%);display:flex;align-items:center;gap:20px;min-height:200px}
.hero .blob{position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.06);right:-80px;bottom:-100px}
.ringbox{position:relative;width:112px;height:112px;flex-shrink:0}
.ringbox svg{transform:rotate(-90deg);display:block}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .mid b{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ringbox .mid u{text-decoration:none;font-size:10.5px;opacity:.75;margin-top:3px}
.hero-msg{position:relative;min-width:0}
.hero-msg .ey{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.6}
.hero-msg h3{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.025em;margin:6px 0 7px;color:#fff;text-transform:none}
.hero-msg p{font-size:12.5px;line-height:1.55;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-height:94px;display:flex;flex-direction:column;cursor:pointer;text-align:left;transition:border-color .15s}
.kpi:hover{border-color:var(--line2)}
.kpi.on{border-color:var(--txt);box-shadow:0 0 0 1px var(--txt)}
.kpi .l{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.035em;margin-top:auto;padding-top:8px;line-height:1}
.kpi.alerta .v{color:var(--warn)} .kpi.mal .v{color:var(--bad)}
.item{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;box-shadow:0 1px 2px rgba(38,33,30,.04)}
@media (max-width:820px){.item{grid-template-columns:minmax(0,1fr);padding:14px}}
.vid{aspect-ratio:9/16;width:100%;border-radius:18px;overflow:hidden;background:#1d1916;position:sticky;top:16px;align-self:start}
@media (max-width:820px){.vid{position:relative;top:0;max-width:340px;margin:0 auto}}
.vid iframe{position:absolute;top:0;left:-6%;width:112%;height:100%;border:0}
.vid .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b5a79f;font-size:13px;text-align:center;padding:20px}
.vid video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.ws{display:flex;flex-direction:column;min-width:0;gap:16px}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.cab .tt{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.cab .st{font-size:12.5px;color:var(--mut);margin-top:3px}
.cab .st a{color:var(--mut);text-decoration:underline;text-underline-offset:2px}
.cab .st a:hover{color:var(--txt)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.e-revisar{background:var(--warn-bg);color:var(--warn)}
.pill.e-error,.pill.e-rechazado{background:var(--bad-bg);color:var(--bad)}
.pill.e-subido,.pill.e-aprobado{background:var(--ok-bg);color:var(--ok)}
.pill.e-procesando,.pill.e-corregir{background:#ECEAF6;color:#5B5592}
h3{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h3 small{font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mut2)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols.solo{grid-template-columns:minmax(0,1fr)}
.cols.solo .subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:320px}
.lst{border:1px solid var(--line);border-radius:16px;background:var(--card);max-height:440px;overflow:auto;scrollbar-width:thin}
.subs{}
.subs label{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:2px;padding:2px 8px;border-top:1px solid var(--line);min-height:38px}
.subs label:first-child{border-top:0}
.subs span{color:var(--mut2);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.subs input{width:100%;border:1px solid transparent;background:transparent;color:var(--txt);font-size:13px;padding:5px 8px;border-radius:9px}
.subs input:focus{outline:none;border-color:var(--line2);background:var(--soft)}
.cambio{background:var(--warn-bg)!important;color:var(--warn)!important}
.nota{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:13.5px;background:var(--card);color:var(--txt);resize:vertical}
.nota:focus{outline:none;border-color:var(--line2)}
.chk{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--mut);margin-top:9px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.ayuda{font-size:12px;color:var(--mut2);margin-top:8px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:11px 13px;font-size:12.5px;white-space:pre-wrap;margin-bottom:12px}
.hist{font-size:12.5px;color:var(--mut);margin-top:12px;background:var(--soft);border-radius:14px;padding:10px 13px}
.vacio{text-align:center;color:var(--mut);padding:60px 20px;background:var(--card);border:1px dashed var(--line2);border-radius:var(--r)}
#login{max-width:360px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
#login h1{font-size:23px}
#login input{width:100%;margin:16px 0 10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:15px;background:var(--soft);color:var(--txt)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--txt);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
#aprende{margin-top:28px}
.apr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 15px;margin-bottom:8px;font-size:13.5px}
.apr .m{font-size:11.5px;color:var(--mut2);margin-bottom:4px}
.apr b{font-weight:600}
.apr .r{margin-top:5px;color:var(--mut)}
.tl{display:flex;flex-direction:column}
.trow{border-top:1px solid var(--line)}.trow:first-child{border-top:0}
.tchip{display:grid;grid-template-columns:62px minmax(0,1fr) 18px;gap:8px;align-items:center;width:100%;border:0;background:transparent;padding:0 12px;min-height:38px;font-size:13px;cursor:pointer;text-align:left;color:var(--txt)}
.tchip:hover{background:var(--soft)}
.tchip b{font-size:11.5px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.tchip small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip i{font-style:normal;color:var(--mut2);font-size:12px;text-align:right}
.trow.ahora .tchip{background:var(--soft)}.trow.ahora .tchip b{color:var(--txt)}
.trow.on{background:var(--soft)}
.trow.marcada .tchip{background:var(--bad-bg)}.trow.marcada .tchip b,.trow.marcada .tchip i{color:var(--bad)}
.tpanel{padding:4px 12px 14px;background:var(--soft)}
.tpanel .q{font-size:12px;color:var(--mut);margin-bottom:8px}
.alts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.alt{cursor:pointer;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#222;font-size:10.5px;color:#fff;text-align:center;line-height:1.3}
.alt .th{width:96px;height:170px;background-repeat:no-repeat;margin:0 auto;transform-origin:top center}
.alt span{display:block;padding:5px 4px;background:#1d1916}
.alt.sel{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.alt.sis{display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--mut);border:2px dashed var(--line2);padding:8px;font-size:12px;font-weight:600}
.alt.sis.sel{border-color:var(--ok);color:var(--ok)}
.tpanel input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--card)}
.tpanel .acciones{margin-top:8px}
.tpanel .btn{min-height:36px;padding:7px 14px;font-size:12.5px}
.barra{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.barra .fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.barra .fila .sp{flex:1}
.barra .resumen{font-size:12.5px;color:var(--bad);font-weight:500}
.btn.link{border:0;background:transparent;color:var(--bad);padding:10px 6px;font-weight:500}
.btn.link:hover{text-decoration:underline}
.aud{border:1px solid var(--line);border-radius:14px;background:var(--soft);font-size:12.5px;color:var(--mut)}
.aud summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--warn);list-style:none}
.aud summary::-webkit-details-marker{display:none}
.aud summary:after{content:"Ver";float:right;font-weight:500;color:var(--mut2)}
.aud[open] summary:after{content:"Ocultar"}
.aud ul{padding:0 14px 12px 30px;max-height:180px;overflow:auto}
.aud li{margin:3px 0}
.hist{font-size:12.5px;color:var(--mut);background:var(--soft);border-radius:14px;padding:10px 14px}
</style>
</head>
<body>
<div id="login">
  <h1>Edición del día</h1>
  <p class="sub">Entrá con tu clave.</p>
  <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
  <button class="btn dark" id="entrar" style="width:100%">Entrar</button>
  <p id="login-e" class="sub" style="color:var(--bad)"></p>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <div><h1>Edición del día</h1><div class="sub" id="resumen">Cargando…</div></div>
    <button class="btn" id="salir">Salir</button>
  </header>
  <div class="marcas" id="marcas"></div>
  <div class="top"><div class="hero" id="hero"></div><div class="kpis" id="tabs"></div></div>
  <div id="lista"></div>
  <section id="aprende" hidden><h3>Lo que aprendió la skill de tus correcciones</h3><div id="aprende-l"></div></section>
</div>
<div class="toast" id="toast"></div>
<script type="module">
const CLAVES = {"vane-2026":"Vane","cima-2026":"Nacho","abril-2026":"Abril"};
const $ = s => document.querySelector(s);
const ESTADOS = [["revisar","Para revisar"],["procesando","Editándose"],["corregir","Corrigiéndose"],["subido","Aprobados"],["rechazado","Rechazados"],["error","Con error"]];
let quien = null, items = {}, filtro = "revisar", fb = null;
let marcaF = new URLSearchParams(location.search).get("marca") || (()=>{ try { return localStorage.getItem("revision_marca") } catch(e){ return null } })() || "todas";
try { quien = CLAVES[localStorage.getItem("revision_clave")] || null; } catch(e) {}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2200); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function entrar(){
  const k = $("#clave").value.trim();
  if(!CLAVES[k]){ $("#login-e").textContent = "Esa clave no es. Probá de nuevo."; return; }
  try { localStorage.setItem("revision_clave", k); } catch(e) {}
  quien = CLAVES[k]; arrancar();
}
$("#entrar").addEventListener("click", entrar);
$("#clave").addEventListener("keydown", e => { if(e.key==="Enter") entrar(); });
$("#salir").addEventListener("click", () => { try { localStorage.removeItem("revision_clave"); } catch(e) {} location.reload(); });

async function arrancar(){
  $("#login").hidden = true; $("#app").hidden = false;
  const [{initializeApp},{getFirestore,collection,doc,onSnapshot,updateDoc},{getAuth,signInAnonymously}] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js")]);
  const app = initializeApp({apiKey:"AIzaSyCTv4DiRCpbCpGYP6E86TPHlkPvaAZTN3g",authDomain:"cleargy-creators.firebaseapp.com",projectId:"cleargy-creators",storageBucket:"cleargy-creators.firebasestorage.app",messagingSenderId:"313543582398",appId:"1:313543582398:web:99fe78991adeea2e7cb4ef"});
  await signInAnonymously(getAuth(app));
  const db = getFirestore(app);
  fb = {db, doc, updateDoc};
  onSnapshot(collection(db,"edicion_cola"), snap => {
    snap.docChanges().forEach(c => { if(c.type==="removed") delete items[c.doc.id]; else items[c.doc.id] = c.doc.data(); });
    pintar();
  }, err => { $("#resumen").textContent = "No se pudo leer la cola: " + err.message; });
  // agente de aprendizaje (aprender.py): cada corrección mejora la skill de edición; acá se ve qué aprendió
  onSnapshot(collection(db,"edicion_aprendizaje"), snap => {
    const xs = snap.docs.map(d=>d.data()).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).slice(0,12);
    $("#aprende").hidden = !xs.length;
    const tipo = t => (t||[]).includes("general") ? "Regla nueva para todos los videos" : (t||[]).includes("codigo") ? "Anotado para el código" : (t||[]).includes("pendiente") ? "Anotado (falta procesar)" : "Solo ese video";
    $("#aprende-l").innerHTML = xs.map(x => `<div class="apr"><div class="m">${esc(new Date(x.fecha).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}))} · ${esc(x.quien)} · ${esc(x.marca)} · ${tipo(x.tipo)}</div><b>${esc(x.resumen||x.nota)}</b>${x.regla?`<div class="r">Regla: ${esc(x.regla)}</div>`:""}</div>`).join("");
  }, () => {});
}

function pintar(){
  const todos = Object.entries(items).filter(([,it]) => it.marca !== "miluz");   // Mi Luz se revisa en /miluz/edicion (Luz)
  const marcas = [...new Set(todos.map(([,it])=>it.marca))].sort(); const nom = m => (todos.find(([,it])=>it.marca===m)||[,{}])[1].marcaNombre||m;
  const deMarca = todos.filter(([,it]) => marcaF==="todas" || it.marca===marcaF);
  const cuenta = e => deMarca.filter(([,it])=>it.estado===e).length;
  const hora = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  $("#resumen").textContent = `Hola ${quien} · actualizado ${hora} · datos en vivo`;
  const hoy = new Date().toISOString().slice(0,10);
  const deHoy = deMarca.filter(([,it]) => (it.creado||"").slice(0,10)===hoy || (it.actualizado||"").slice(0,10)===hoy);
  const listos = deHoy.filter(([,it]) => ["subido","aprobado","rechazado"].includes(it.estado)).length;
  const total = deHoy.length, pct = total ? Math.round(listos/total*100) : 0, R = 48, C = 2*Math.PI*R;
  const pend = cuenta("revisar"), enCurso = cuenta("procesando")+cuenta("corregir");
  $("#hero").innerHTML = `<div class="blob"></div>
    <div class="ringbox"><svg width="112" height="112"><circle cx="56" cy="56" r="${R}" stroke="rgba(255,255,255,.14)" stroke-width="9" fill="none"/>
      <circle cx="56" cy="56" r="${R}" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <div class="mid"><b>${pct}%</b><u>revisado hoy</u></div></div>
    <div class="hero-msg"><div class="ey">${marcaF==="todas"?"Todas las marcas":esc(nom(marcaF))} · hoy</div>
      <h3>${listos} de ${total} ${total===1?"video revisado":"videos revisados"}</h3>
      <p>${pend?`<b>${pend} ${pend===1?"espera":"esperan"} tu revisión.</b> `:"No hay nada esperando. "}${enCurso?`${enCurso} ${enCurso===1?"se está editando":"se están editando"}.`:""}${cuenta("error")?` ${cuenta("error")} con error.`:""}</p></div>`;
  const cls = e => e==="revisar"&&cuenta(e)?"alerta":e==="error"&&cuenta(e)?"mal":"";
  $("#tabs").innerHTML = ESTADOS.map(([e,t]) => `<button class="kpi ${cls(e)} ${e===filtro?"on":""}" data-e="${e}"><span class="l">${t}</span><span class="v">${cuenta(e)}</span></button>`).join("");
  if(marcaF!=="todas" && !marcas.includes(marcaF) && marcas.length) marcaF = "todas";
  const porRevisar = m => todos.filter(([,it]) => (m==="todas"||it.marca===m) && it.estado==="revisar").length;
  $("#marcas").innerHTML = ["todas",...marcas].map(m=>`<button class="mt ${m===marcaF?"on":""}" data-m="${m}">${m==="todas"?"Todas las marcas":esc(nom(m))}${porRevisar(m)?`<b>${porRevisar(m)}</b>`:""}</button>`).join("");
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{filtro=b.dataset.e;pintar();});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{marcaF=b.dataset.m; try{localStorage.setItem("revision_marca",marcaF)}catch(e){} pintar();});
  const lista = deMarca.filter(([,it])=>it.estado===filtro).sort((a,b)=>(a[1].fechaCrudo||"").localeCompare(b[1].fechaCrudo||""));
  if(!lista.length){ $("#lista").innerHTML = `<div class="vacio">${filtro==="revisar"?"No hay videos para revisar. Los de hoy aparecen solos cuando terminan de editarse.":"Nada por acá."}</div>`; return; }
  // si está escribiendo una corrección, no le borramos lo que tipeó: se repinta cuando suelta
  const editando = [...document.querySelectorAll("#lista .cambio, #lista .otro-broll:checked:not(.rh)")].length || (document.activeElement && document.activeElement.closest("#lista input, #lista textarea"));
  if(editando){ pendiente = true; return; }
  pendiente = false;
  // 23/10 (Nacho: "cuando estoy viendo uno me recarga y me reinicia todo"): la cola cambia a cada rato por OTROS videos que
  // se editan; antes se redibujaba toda la lista y el video que estabas mirando volvía a cero. Ahora solo se rehace la
  // tarjeta de un video que cambió DE VERDAD (versión, estado o archivo); las demás quedan intactas, con su video andando.
  const caja = $("#lista");
  caja.querySelectorAll(".vacio").forEach(x => x.remove());
  const firma = it => [it.estado, it.version, it.vistaId, it.vistaUrl, it.driveId, it.archivo, (it.notas||[]).length, it.nota].join("|");
  const quedan = new Set(lista.map(([id]) => "it-" + id));
  [...caja.children].forEach(el => { if(!quedan.has(el.id)) el.remove(); });
  let antes = null;
  lista.forEach(([id,it]) => {
    let el = document.getElementById("it-" + id);
    if(!el || el.dataset.firma !== firma(it)){
      const t = document.createElement("div"); t.innerHTML = tarjeta(id,it).trim();
      const nuevo = t.firstElementChild; nuevo.dataset.firma = firma(it);
      if(el) el.replaceWith(nuevo); else caja.appendChild(nuevo);
      el = nuevo; conectar(id);
    }
    if(antes ? antes.nextElementSibling !== el : caja.firstElementChild !== el) (antes ? antes.after(el) : caja.prepend(el));
    antes = el;
  });
}
let pendiente = false;
document.addEventListener("focusout", () => setTimeout(() => { if(pendiente && !document.querySelector("#lista .cambio, #lista .otro-broll:checked:not(.rh)")) pintar(); }, 200));

function tarjeta(id,it){
  const verId = it.vistaId || it.driveId;   // la versión liviana: Drive la prepara en 1-2 min
  const vid = it.vistaUrl
    ? `<video class="rv" controls playsinline preload="metadata" src="${esc(it.vistaUrl)}"></video>`
    : verId
    ? `<iframe src="https://drive.google.com/file/d/${esc(verId)}/preview" allow="autoplay" loading="lazy"></iframe>`
    : `<div class="ph">${it.estado==="revisar"?"El video se está subiendo… recargá en un minuto":"Editándose…"}</div>`;
  const fecha = (it.fechaCrudo||"").slice(0,10).split("-").reverse().slice(0,2).join("/");
  const subs = (it.pantallas||[]).map((t,i)=>`<label><span>${i+1}</span><input data-i="${i}" value="${esc(t)}" data-orig="${esc(t)}"></label>`).join("");
  const editable = it.estado==="revisar";
  const rehacible = ["subido","aprobado"].includes(it.estado);   // Nacho 12/10: rehacer un aprobado con una nota
  const conTomas = editable && it.vistaUrl && (it.tomasLinea||[]).length;
  const estado = (ESTADOS.find(e=>e[0]===it.estado)||[,it.estado])[1];
  const links = [it.driveId?`<a href="https://drive.google.com/file/d/${esc(it.driveId)}/view" target="_blank" rel="noopener">Drive</a>`:"",
                 it.crudoLink?`<a href="${esc(it.crudoLink)}" target="_blank" rel="noopener">Crudo</a>`:""].filter(Boolean).join(" · ");
  // los avisos del control automático vienen en una sola línea con " | ": van plegados, uno por renglón
  const nota = it.nota||"", esAviso = /control marcó/i.test(nota);
  const avisos = esAviso ? [...new Set(nota.replace(/^.*?control marcó:\s*/i,"").split(/\s*\|\s*/).filter(Boolean))] : [];
  return `<div class="item" id="it-${esc(id)}">
    <div class="vid">${vid}</div>
    <div class="ws">
      <div class="cab">
        <div><div class="tt">${esc(it.creadora||"Sin creadora")} · Guion ${esc(it.guion||"—")}</div>
          <div class="st">${esc(it.marcaNombre||it.marca)}${fecha?` · ${fecha}`:""}${it.version>1?` · versión ${it.version}`:""}${links?` · ${links}`:""}</div></div>
        <span class="pill e-${esc(it.estado)}">${esc(estado)}</span>
      </div>
      ${it.error?`<div class="err">${esc(it.error)}</div>`:""}
      <div class="cols ${conTomas?"":"solo"}">
        ${subs?`<div><h3>Subtítulos <small>${editable||rehacible?"tocá uno para corregirlo":""}</small></h3><div class="lst subs">${subs}</div></div>`:""}
        ${conTomas?`<div class="tomas"><h3>Tomas de b-roll <small>tocá la que no te guste</small></h3>
          <div class="lst tl">${it.tomasLinea.map((t,i)=>`<div class="trow" data-k="${i}" data-t0="${t.t0}" data-t1="${t.t1}"><button class="tchip"><b>${Number(t.t0).toFixed(1)} s</b><small>${esc(t.frase||t.clip)}</small><i>›</i></button></div>`).join("")}</div>
        </div>`:""}
      </div>
      ${avisos.length?`<details class="aud"><summary>⚠️ El control automático marcó ${avisos.length} ${avisos.length===1?"cosa":"cosas"} para mirar</summary><ul>${avisos.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></details>`:""}
      ${nota && !esAviso?`<div class="hist">${esc(nota)}</div>`:""}
      ${(it.notas||[]).length?`<div class="hist"><b>Correcciones pedidas antes:</b> ${(it.notas||[]).map(esc).join(" · ")}</div>`:""}
      ${editable?`
      <div class="barra">
        <h3>Qué hay que cambiar <small>opcional</small></h3>
        <textarea class="nota" rows="2" placeholder="Ej.: seg 23 el b-roll no tiene que ver, poné algo de enzimas"></textarea>
        <div class="fila">
          <label class="chk" style="margin:0"><input type="checkbox" class="otro-broll"> Elegir todo el b-roll de nuevo</label>
          <span class="sp"></span><span class="resumen tpend"></span>
        </div>
        <div class="fila">
          <button class="btn link rechazar" title="Solo si el crudo no sirve: audio cortado, mal grabado">Rechazar el crudo</button>
          <span class="sp"></span>
          <button class="btn dark corregir" disabled>Mandar correcciones</button>
          <button class="btn ok aprobar">Aprobar</button>
        </div>
        <p class="ayuda" style="margin:0">Si marcás solo tomas, se cambian esas y vuelve en minutos. Con texto o subtítulos, vuelve re-editado en ~20 min.</p>
      </div>`:""}
      ${rehacible?`
      <div class="barra">
        <h3>Rehacer este video <small>opcional</small></h3>
        <textarea class="nota" rows="2" placeholder="Ej.: seg 12 poné el frasco · más corto el arranque"></textarea>
        <div class="fila"><label class="chk" style="margin:0"><input type="checkbox" class="otro-broll rh" checked> Elegir todo el b-roll de nuevo</label><span class="sp"></span><button class="btn dark corregir rehacer">Rehacer</button></div>
        <p class="ayuda" style="margin:0">Vuelve a "Para revisar" en ~20 min. Hasta que lo apruebes de nuevo, la app sigue con la versión anterior.</p>
      </div>`:""}
      ${it.estado==="error"?`<div class="acciones"><button class="btn reintentar">Volver a intentar</button></div>`:""}
    </div></div>`;
}

function conectar(id){
  const el = document.getElementById("it-"+id); if(!el) return;
  const corr = el.querySelector(".corregir"), ob = el.querySelector(".otro-broll");
  const nt = el.querySelector(".nota");
  const esRehacer = !!el.querySelector(".rehacer");
  const hayCambios = () => esRehacer || Object.keys(marcadasDe[id]||{}).length || [...el.querySelectorAll(".subs input")].some(i=>i.value!==i.dataset.orig) || (ob && ob.checked) || (nt && nt.value.trim());
  nt && nt.addEventListener("input", () => { nt.classList.toggle("cambio", !!nt.value.trim()); corr.disabled = !hayCambios(); });
  el.querySelectorAll(".subs input").forEach(i => i.addEventListener("input", () => { i.classList.toggle("cambio", i.value!==i.dataset.orig); if(corr) corr.disabled=!hayCambios(); }));
  ob && ob.addEventListener("change", () => { corr.disabled = !hayCambios(); });
  const ref = fb.doc(fb.db,"edicion_cola",id);
  const marcar = async (datos,msg) => { try { await fb.updateDoc(ref,{...datos,revisadoPor:quien,actualizado:new Date().toISOString()}); toast(msg);
      el.querySelectorAll(".cambio").forEach(i=>i.classList.remove("cambio")); if(ob) ob.checked=false; document.activeElement?.blur(); pintar(); } catch(e){ toast("No se pudo guardar: "+e.message); } };
  el.querySelector(".aprobar")?.addEventListener("click", () => marcar({estado:"aprobado"}, "Aprobado: pasa a Editados y a la app"));
  corr?.addEventListener("click", () => {
    const pantallas = [...el.querySelectorAll(".subs input")].map(i=>i.value);
    if(esRehacer){
      if(!confirm("¿Rehacer este video? Vuelve a Para revisar; la app sigue con el aprobado hasta que apruebes el nuevo.")) return;
      return marcar({estado:"corregir", pedido:{pantallas, broll:!!(ob&&ob.checked), nota:(nt?nt.value.trim():""), por:quien, rehacer:true}}, "Listo: se rehace y vuelve a Para revisar en ~20 min");
    }
    const tomas = Object.values(marcadasDe[id]||{}).map(m => ({t: m.t, ...(m.clip ? {clip: m.clip} : {}), ...(m.nota ? {nota: m.nota} : {})}));
    const otros = [...el.querySelectorAll(".subs input")].some(i=>i.value!==i.dataset.orig) || (ob && ob.checked) || (nt && nt.value.trim());
    if(tomas.length && !otros)
      return marcar({estado:"corregir", pedido:{tomas, por:quien}}, `Listo: se ${tomas.length===1?"cambia esa toma":"cambian esas "+tomas.length+" tomas"} y vuelve en unos minutos`);
    const extra = tomas.length ? " | Cambiar las tomas de los seg " + tomas.map(m=>m.t.toFixed(1)+(m.nota?" ("+m.nota+")":"")).join(", ") : "";
    marcar({estado:"corregir", pedido:{pantallas, broll:!!(ob&&ob.checked), nota:((nt?nt.value.trim():"")+extra).replace(/^ \| /,""), por:quien}}, "Listo: vuelve editado en ~20 min · la skill aprende de esto");
  });
  el.querySelector(".rechazar")?.addEventListener("click", () => {
    const n = el.querySelector(".nota").value.trim();
    if(!n){ el.querySelector(".nota").focus(); toast("Escribí por qué no sirve el crudo"); return; }
    if(!confirm("¿Rechazar el crudo? Es solo si hay que volver a grabarlo. Para cambios de edición usá \"Mandar correcciones\".")) return;
    marcar({estado:"rechazado", nota:n}, "Rechazado");
  });
  el.querySelector(".reintentar")?.addEventListener("click", () => marcar({estado:"corregir", pedido:{}}, "Se vuelve a intentar"));
  // revisión por tomas (tipo Frame.io, Nacho 24/10): tocar una toma → se abre ahí mismo con 3 reemplazos → marcar.
  // "Mandar correcciones" manda las tomas marcadas (solo cambio de toma) o, si además hay texto/subtítulos, todo junto.
  const it = items[id] || {}, lin = it.tomasLinea || [], video = el.querySelector("video.rv");
  marcadasDe[id] = {};
  if(!lin.length || !el.querySelector(".trow")) return;
  const marcadas = marcadasDe[id];
  const pend = () => { const n = Object.keys(marcadas).length;
    el.querySelector(".tpend").textContent = n ? `${n} ${n===1?"toma marcada":"tomas marcadas"} para cambiar` : "";
    el.querySelectorAll(".trow").forEach(c => c.classList.toggle("marcada", c.dataset.k in marcadas));
    if(corr) corr.disabled = !hayCambios(); };
  const cerrar = () => { el.querySelectorAll(".tpanel").forEach(x=>x.remove()); el.querySelectorAll(".trow").forEach(c=>c.classList.remove("on")); };
  const abrir = k => {
    const row = el.querySelector(`.trow[data-k="${k}"]`), yaAbierta = row.classList.contains("on");
    cerrar(); if(yaAbierta) return;
    const t = lin[k]; row.classList.add("on");
    if(video){ video.currentTime = Number(t.t0) + 0.05; }
    const m = marcadas[k] || {};
    const cel = (a,j) => `<div class="alt ${m.clip===a.clip?"sel":""}" data-clip="${esc(a.clip)}" title="${esc(a.desc)}"><div class="th" style="background-image:url('${esc(it.tomasGrilla||"")}');background-size:288px auto;background-position:-${j*96}px -${(t.fila*170.4).toFixed(1)}px"></div><span>${esc((a.desc||"").slice(0,26))}</span></div>`;
    const panel = document.createElement("div"); panel.className = "tpanel";
    panel.innerHTML = `<div class="q">${Number(t.t0).toFixed(1)}–${Number(t.t1).toFixed(1)} s · «${esc(t.frase||"")}» · elegí con qué reemplazarla</div>
      <div class="alts">${(t.alts||[]).map(cel).join("")}<div class="alt sis ${(k in marcadas) && !m.clip?"sel":""}" data-clip="">Que elija el sistema</div></div>
      <input class="tnota" placeholder="Opcional: qué querés ver acá (ej. el frasco, una panza, sin cara)" value="${esc(m.nota||"")}">
      <div class="acciones"><button class="btn dark tmarcar">${k in marcadas?"Actualizar":"Marcar para cambiar"}</button>${k in marcadas?'<button class="btn tquitar">Dejarla como está</button>':""}</div>`;
    row.appendChild(panel);
    let elegido = m.clip ?? null;
    panel.querySelectorAll(".alt").forEach(a => a.onclick = () => { panel.querySelectorAll(".alt").forEach(x=>x.classList.remove("sel")); a.classList.add("sel"); elegido = a.dataset.clip; });
    panel.querySelector(".tmarcar").onclick = () => { marcadas[k] = {t: Number(t.t0) + 0.1, clip: elegido || "", nota: panel.querySelector(".tnota").value.trim()}; pend(); cerrar(); };
    const q = panel.querySelector(".tquitar"); if(q) q.onclick = () => { delete marcadas[k]; pend(); cerrar(); };
  };
  el.querySelectorAll(".tchip").forEach(c => c.onclick = () => abrir(c.parentElement.dataset.k));
  if(video) video.addEventListener("timeupdate", () => { const s = video.currentTime;
    el.querySelectorAll(".trow").forEach(c => c.classList.toggle("ahora", s >= Number(c.dataset.t0) && s < Number(c.dataset.t1))); });
}
const marcadasDe = {};

if(quien) arrancar();
</script>
</body>
</html>
