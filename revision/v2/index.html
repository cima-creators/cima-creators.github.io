<div id="login">

</div>

<script type="module">
const CLAVES = {"vane-2026":"Vane","cima-2026":"Nacho","abril-2026":"Abril"};
const $ = s => document.querySelector(s);
const ESTADOS = [["revisar","Para revisar"],["procesando","Editándose"],["corregir","Corrigiéndose"],["subido","Aprobados"],["rechazado","Rechazados"],["error","Con error"]];
const VELS = [1, 1.25, 1.5, 2];
let quien = null, items = {}, fb = null;
const S = {vista: location.hash === "#revision" ? "revision" : "inicio", app:null, filtro:"revisar", cre:"", abierto:null, firma:"", sec:"notas", vel:1, loc:{}, tNota:null, general:false, activa:null, tomaAb:null, rech:false, orden:[]};
let marcaF = new URLSearchParams(location.search).get("marca") || (()=>{ try { return localStorage.getItem("revision_marca") } catch(e){ return null } })() || "todas";
try { quien = CLAVES[localStorage.getItem("revision_clave")] || null; S.vel = Number(localStorage.getItem("revision_vel")) || 1; } catch(e) {}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2400); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const tc = (t, dec=true) => { t = Math.max(0, Number(t)||0); const m = Math.floor(t/60), s = t - m*60; return m + ":" + (dec ? s.toFixed(1).padStart(4,"0").replace(".",",") : String(Math.floor(s)).padStart(2,"0")); };
const tab = it => it.estado==="aprobado" ? "subido" : it.estado;   // lo aprobado pasa a Aprobados al toque (el bot lo sube en ≤5 min)
const loc = id => S.loc[id] || (S.loc[id] = {marc:{}, subs:{}, broll:false});
const ver = it => Number(it.version) || 1;
const notasT = it => Array.isArray(it.notasT) ? it.notasT : [];
const pend = it => notasT(it).filter(n => n.estado === "pend");
const V = () => $("#vVideo");
const editable = it => it.estado === "revisar";
const rehacible = it => ["subido","aprobado"].includes(it.estado);

function entrar(){
  const k = $("#clave").value.trim();
  if(!CLAVES[k]){ $("#login-e").textContent = "Esa clave no es. Probá de nuevo."; return; }
  try { localStorage.setItem("revision_clave", k); } catch(e) {}
  quien = CLAVES[k]; arrancar();
}
$("#entrar").addEventListener("click", entrar);
$("#clave").addEventListener("keydown", e => { if(e.key==="Enter") entrar(); });

async function arrancar(){
  $("#login").hidden = true; $("#app").hidden = false;

    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js")]);
  const app = initializeApp({apiKey:"AIzaSyCTv4DiRCpbCpGYP6E86TPHlkPvaAZTN3g",authDomain:"cleargy-creators.firebaseapp.com",projectId:"cleargy-creators",storageBucket:"cleargy-creators.firebasestorage.app",messagingSenderId:"313543582398",appId:"1:313543582398:web:99fe78991adeea2e7cb4ef"});
  await signInAnonymously(getAuth(app));
  // 10/11 (Nacho: "carga muy lento"): la cola entera tardaba 9 s. Ahora queda guardada en el navegador (la segunda vez
  // abre al instante y solo baja lo que cambió) y primero se pide lo vivo (revisar, editándose, trabados); lo ya
  // aprobado llega después, sin frenar la pantalla.
  let db;
  try { db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
  catch(e) { db = getFirestore(app); }
  fb = {db, doc, updateDoc, getDocs, collection};
  const en = {vivo: new Set(), resto: new Set()};
  const oir = (cual, estados, alListo) => { let primera = true;
    onSnapshot(query(collection(db,"edicion_cola"), where("estado","in",estados)), snap => {
      snap.docChanges().forEach(c => { const id = c.doc.id, otro = cual === "vivo" ? en.resto : en.vivo;
        if(c.type === "removed"){ en[cual].delete(id); if(!otro.has(id)) delete items[id]; }
        else { en[cual].add(id); items[id] = c.doc.data(); } });
      S.cargado = S.cargado || cual === "vivo"; if(cual === "resto") S.completo = true;
      pintar();
      if(primera){ primera = false; alListo && alListo(); }
    }, err => { $("#resumen").textContent = "No se pudo leer la cola: " + err.message; }); };
  oir("vivo", ["revisar","procesando","corregir","error"], () => oir("resto", ["subido","aprobado","rechazado"], leerApp));
  onSnapshot(collection(db,"edicion_aprendizaje"), snap => {
    const xs = snap.docs.map(d=>d.data()).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).slice(0,12);
    $("#aprende").hidden = !xs.length;
    const tipo = t => (t||[]).includes("general") ? "Regla nueva para todos los videos" : (t||[]).includes("codigo") ? "Anotado para el código" : (t||[]).includes("pendiente") ? "Anotado (falta procesar)" : "Solo ese video";
    $("#aprende-l").innerHTML = xs.map(x => `<div class="apr"><div class="m">${esc(new Date(x.fecha).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}))} · ${esc(x.quien)} · ${esc(x.marca)} · ${tipo(x.tipo)}</div><b>${esc(x.resumen||x.nota)}</b>${x.regla?`<div class="r">Regla: ${esc(x.regla)}</div>`:""}</div>`).join("");
  }, () => {});
}

function pintar(){

  const marcas = [...new Set(todos.map(([,it])=>it.marca))].sort(); const nom = m => (todos.find(([,it])=>it.marca===m)||[,{}])[1].marcaNombre||m;

  $("#tabs").innerHTML = ESTADOS.map(([e,t]) => `<button class="tab ${cls(e)} ${e===S.filtro?"on":""}" data-e="${e}">${t}<b>${cuenta(e)}</b></button>`).join("");
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{S.filtro=b.dataset.e; pintar();});

  $("#vInicio").hidden = S.vista !== "inicio"; $("#vRevision").hidden = S.vista !== "revision";
  if(S.vista === "inicio") pintarInicio(deMarca);
  const enTab = deMarca.filter(([,it])=>tab(it)===S.filtro);

  const lista = enTab.filter(([,it]) => !S.cre || (it.creadora||"Sin creadora")===S.cre).sort((a,b)=>(a[1].fechaCrudo||"").localeCompare(b[1].fechaCrudo||""));

        <span class="tit">${esc(it.creadora||"Sin creadora")} · ${esc(it.guion||"sin guion")}</span>
        <span class="m"><span>${esc(it.marcaNombre||it.marca)}</span>${fecha?`<span>${fecha}</span>`:""}${/control marcó/i.test(it.nota||"")?`<span class="w">con avisos</span>`:""}${espera}</span></button>`;

// Inicio: los números de la cola en vivo + lo que está en la app de videos y todavía no tiene su editado, con el porqué
function pintarInicio(deMarca){
  const hs = it => it.actualizado ? (Date.now() - new Date(it.actualizado)) / 36e5 : 0;
  const de = e => deMarca.filter(([,it]) => it.estado === e);
  const rev = de("revisar"), viejos = rev.filter(([,it]) => hs(it) >= 24), curso = [...de("procesando"), ...de("corregir")], err = de("error");
  const hace7 = new Date(Date.now() - 7 * 864e5).toISOString().slice(0,10);
  const sem = deMarca.filter(([,it]) => ["subido","aprobado"].includes(it.estado) && (it.fechaEdicion || "") >= hace7);
  const app = S.app && sinEditar();
  const v1 = n => S.cargado || Object.keys(items).length ? n : "…", v2 = n => S.completo || !fb || !fb.getDocs ? n : "…";
  const met = (n, l, d, cls, f) => `<${f?"button":"div"} class="met ${cls||""}" ${f?`data-ir="${f}"`:""}><b>${n}</b><span class="l">${l}</span><span class="d">${d}</span></${f?"button":"div"}>`;
  $("#vInicio").innerHTML = `<div class="hero"><h2>Sala de<br>edición</h2><p>Lo que se graba, se edita, se corrige y se sube. Todo en un mismo lugar.</p></div>
    <div class="mets">
      ${met(v1(rev.length), "Por revisar", "Videos editados que esperan a Abril", rev.length ? "av" : "", "revisar")}
      ${met(v1(viejos.length), "Esperan hace +24 h", "Editados que nadie miró todavía", viejos.length ? "mal" : "", "revisar")}
      ${met(v1(curso.length), "En edición", "Editándose o corrigiéndose ahora", "", "corregir")}
      ${met(v1(err.length), "Trabados", "El control los frenó: hay que mirarlos", err.length ? "mal" : "", "error")}
      ${met(v2(sem.length), "Aprobados", "Editados en los últimos 7 días", "", "subido")}
      ${met(app ? app.total : "…", "Sin editar en la app", app ? `De ${app.subidos} subidos en 14 días` : "Leyendo la app de videos…", app && app.total ? "av" : "")}
    </div>
    ${app && app.total ? `<div class="info"><h3>ⓘ Por qué hay ${app.total} ${app.total===1?"video":"videos"} de la app sin su editado</h3>${app.motivos.map(([m, n, det]) => `<div class="r"><b>${n}</b><div>${esc(m)}${det?`<br><span>${esc(det)}</span>`:""}</div></div>`).join("")}</div>` : ""}`;
  document.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => irA("revision", b.dataset.ir));
}
// cruza los videos de la app (últimos 14 días, sin editado) con la cola de edición para decir por qué falta cada uno
function sinEditar(){
  const desde = new Date(Date.now() - 14 * 864e5).toISOString(), g = {}, sub = [];
  const suma = (m, quien) => { (g[m] = g[m] || []).push(quien); };
  for(const [marca, docs] of Object.entries(S.app)){
    if(marcaF !== "todas" && marca !== marcaF) continue;
    for(const d of docs){
      if((d.fecha || "") < desde || d.status === "rejected") continue;
      sub.push(d); if(d.editado) continue;
      const it = items[marca + "__" + d.id], q = `${d.creadora} ${d.guion||""}`.trim();
      if(!it) suma(d.link ? "Todavía no entró al editor (creadora sin banco de b-roll, o el bot no pasó)" : "La creadora no cargó el link de Drive del crudo", q);
      else if(it.estado === "revisar") suma("Ya está editado: espera la revisión de Abril", q);
      else if(["procesando","corregir"].includes(it.estado)) suma("Se está editando o corrigiendo ahora", q);
      else if(it.estado === "error") suma("Trabado: el control lo frenó y hay que mirarlo", q);
      else if(it.estado === "rechazado") suma("Rechazado: no es un crudo (toma de b-roll) o hay que regrabarlo", q);
      else if(["aprobado","subido"].includes(it.estado)) suma("Aprobado: se está subiendo a la app", q);
    }
  }
  const motivos = Object.entries(g).sort((a,b) => b[1].length - a[1].length).map(([m, qs]) => [m, qs.length, qs.slice(0,8).join(" · ") + (qs.length > 8 ? ` · y ${qs.length - 8} más` : "")]);
  return {total: motivos.reduce((s, m) => s + m[1], 0), subidos: sub.length, motivos};
}
async function leerApp(){
  if(!fb || !fb.getDocs || S.leyendo) return; S.leyendo = true;
  const cols = {}; Object.values(items).forEach(it => { if(it.marca !== "miluz" && it.coleccion && /_videos$/.test(it.coleccion)) cols[it.marca] = it.coleccion; });
  const app = {};
  await Promise.all(Object.entries(cols).map(async ([marca, col]) => { try {
    const snap = await fb.getDocs(fb.collection(fb.db, col));
    const nombres = {}; Object.values(items).forEach(it => { if(it.marca === marca && it.videoId) nombres[it.videoId.split("_")[0]] = it.creadora; });
    app[marca] = snap.docs.map(d => { const v = d.data(), link = v.driveLink || (/drive\.google/.test(v.link||"") ? v.link : "");
      return {id: d.id, fecha: v.date || "", status: v.status, editado: !!v.editado, link: !!link, guion: v.guion || "", creadora: nombres[v.creator] || v.creator || ""}; })
      .filter(v => !/b-?roll/i.test(v.guion));
  } catch(e){ app[marca] = []; } }));
  S.app = app; S.leyendo = false; if(S.vista === "inicio") pintar();
}

function conectarVideo(id){
  const v = V(); if(!v) { conectarForm(id); return; }
  v.playbackRate = S.vel;
  const dur = () => v.duration || Math.max(0, ...((items[id]||{}).tomasLinea||[]).map(t=>Number(t.t1)||0)) || 1;
  const tick = () => { const p = Math.min(100, v.currentTime / dur() * 100);
    $("#vHecho").style.width = p + "%"; $("#vCab").style.left = p + "%";
    $("#vTc").innerHTML = `<b>${tc(v.currentTime)}</b> / ${tc(dur(), false)}`;
    $("#vPlay").textContent = v.paused ? "▶ Play" : "❚❚ Pausa";
    if(!$("#vTexto").value && !S.general){ S.tNota = null; $("#vDonde").textContent = tc(v.currentTime); }
    const s = v.currentTime;
    document.querySelectorAll("[data-t0]").forEach(c => c.classList.toggle("ahora", s >= Number(c.dataset.t0) && s < Number(c.dataset.t1))); };
  ["timeupdate","play","pause","loadedmetadata","seeked"].forEach(e => v.addEventListener(e, tick));
  v.addEventListener("loadedmetadata", pintarPista);
  v.addEventListener("click", () => v.paused ? v.play() : v.pause());
  $("#vPlay").onclick = () => v.paused ? v.play() : v.pause();
  $("#vAtras").onclick = () => { v.currentTime = Math.max(0, v.currentTime - 2); };
  $("#vAdel").onclick = () => { v.currentTime = Math.min(dur(), v.currentTime + 2); };
  $("#vVel").onclick = () => { S.vel = VELS[(VELS.indexOf(S.vel) + 1) % VELS.length]; v.playbackRate = S.vel; $("#vVel").textContent = S.vel + "×"; try{localStorage.setItem("revision_vel", S.vel)}catch(e){} };
  const pista = $("#vPista"); let arr = false;
  const ir = e => { const r = pista.getBoundingClientRect(); v.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * dur(); };
  pista.addEventListener("pointerdown", e => { if(e.target.closest(".mk,.seg")) return; arr = true; pista.setPointerCapture(e.pointerId); ir(e); });
  pista.addEventListener("pointermove", e => { if(arr) ir(e); });
  pista.addEventListener("pointerup", () => { arr = false; });
  conectarForm(id);
}

function pintarCabecera(id, it){
  const estado = (ESTADOS.find(e=>e[0]===tab(it))||[,it.estado])[1];
  const fecha = (it.fechaCrudo||"").slice(0,10).split("-").reverse().slice(0,2).join("/");
  const links = [it.driveId?`<a href="https://drive.google.com/file/d/${esc(it.driveId)}/view" target="_blank" rel="noopener">Drive</a>`:"",
                 it.crudoLink?`<a href="${esc(it.crudoLink)}" target="_blank" rel="noopener">Crudo</a>`:""].filter(Boolean).join(" · ");
  const nota = it.nota||"", esAviso = /control marcó/i.test(nota);
  const avisos = esAviso ? [...new Set(nota.replace(/^.*?control marcó:\s*/i,"").split(/\s*\|\s*/).filter(Boolean))] : [];
  const ab = $("#vCabe details")?.open;
  $("#vCabe").innerHTML = `<div class="l1"><h2>${esc(it.creadora||"Sin creadora")} · ${esc(it.guion||"sin guion")}</h2><span class="pill e-${esc(it.estado)}">${esc(estado)}</span>
      <span class="nav"><button class="btn ch" id="vPrev" title="Video anterior (↑)" ${vecino(-1)?"":"disabled"}>←</button><button class="btn ch" id="vNext" title="Video siguiente (↓)" ${vecino(1)?"":"disabled"}>→</button><button class="btn ch" id="vCerrar" title="Cerrar (Esc)">✕ Cerrar</button></span></div>
    <div class="st">${esc(it.marcaNombre||it.marca)}${fecha?` · ${fecha}`:""} · versión ${ver(it)}${it.revisadoPor?` · revisó ${esc(it.revisadoPor)}`:""}${links?` · ${links}`:""}</div>
    ${it.error?`<div class="err">${esc(it.error)}</div>`:""}
    ${avisos.length?`<details class="aud" ${ab?"open":""}><summary>El control automático marcó ${avisos.length} ${avisos.length===1?"cosa":"cosas"} para mirar</summary><ul>${avisos.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></details>`:""}
    ${nota && !esAviso?`<div class="hist" style="margin:8px 0 0">${esc(nota)}</div>`:""}`;
  $("#vPrev").onclick = () => vecino(-1) && abrir(vecino(-1)); $("#vNext").onclick = () => vecino(1) && abrir(vecino(1)); $("#vCerrar").onclick = cerrarVisor;
}

function pintarCuerpo(){
  const id = S.abierto, it = items[id]; if(!it || !$("#cuerpo")) return;
  const L = loc(id), ns = notasT(it), lin = (editable(it) && it.vistaUrl) ? (it.tomasLinea||[]) : [];
  const subs = (it.pantallas||[]).map(t=>(t && typeof t==="object")?(t.texto||""):t);
  const nSubs = Object.keys(L.subs).length, nMarc = Object.keys(L.marc).length;
  const secs = [["notas","Notas",ns.filter(n=>n.estado!=="ok").length], ...(lin.length?[["tomas","Tomas",nMarc||lin.length]]:[]), ...(subs.length?[["subs","Subtítulos",nSubs||""]]:[])];
  if(!secs.find(s=>s[0]===S.sec)) S.sec = "notas";
  $("#vSecs").innerHTML = secs.map(([k,t,n]) => `<button class="sec ${k===S.sec?"on":""}" data-sec="${k}">${t}${n!==""?`<b>${n}</b>`:""}</button>`).join("");
  document.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { S.sec = b.dataset.sec; pintarCuerpo(); });
  const c = $("#cuerpo");
  if(c.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && c.dataset.sec === S.sec){ pintarPista(); return; }   // está escribiendo: no se le borra
  c.dataset.sec = S.sec;
  const ed = editable(it) || rehacible(it);
  if(S.sec === "notas"){
    const orden = [...ns].sort((a,b) => (b.ver - a.ver) || ((a.t ?? -1) - (b.t ?? -1)));
    const et = n => n.estado==="ok" ? `<span class="et ok">resuelta</span>` : n.estado==="env" ? `<span class="et env">${n.ver < ver(it) ? "pedida en v"+n.ver+": ¿quedó?" : "enviada"}</span>` : "";
    c.innerHTML = (orden.length ? orden.map(n => `<div class="nota ${n.estado==="ok"?"ok":""} ${n.id===S.activa?"act":""}" data-nota="${esc(n.id)}">
        <button class="tcb ${n.t==null?"gen":""}" data-ir="${esc(n.id)}">${n.t==null?"General":tc(n.t)}</button><span class="tx">${esc(n.texto)}</span>
        <span class="pie"><span>${esc(n.por||"")} · v${n.ver}</span>${et(n)}
          ${n.estado==="env" && n.ver < ver(it) && ed ? `<button class="si" data-ok="${esc(n.id)}">Quedó bien</button><button class="no" data-mal="${esc(n.id)}">Sigue mal</button>` : ""}
          ${n.estado==="pend" ? `<button data-borrar="${esc(n.id)}">Borrar</button>` : ""}</span></div>`).join("")
      : `<p class="vacio">${ed?"Sin notas todavía. Pausá donde quieras cambiar algo y escribí abajo: la nota queda clavada en ese segundo.":"Sin notas."}</p>`)
      + ((it.notas||[]).length ? `<div class="hist"><b>Correcciones pedidas antes:</b> ${(it.notas||[]).map(esc).join(" · ")}</div>` : "");
    c.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => irNota(b.dataset.ir));
    const cambiar = fn => guardar(id, {notasT: fn(notasT(items[id]).map(n => ({...n})))});
    c.querySelectorAll("[data-borrar]").forEach(b => b.onclick = () => cambiar(a => a.filter(n => n.id !== b.dataset.borrar)));
    c.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => cambiar(a => a.map(n => n.id === b.dataset.ok ? {...n, estado:"ok"} : n)));
    c.querySelectorAll("[data-mal]").forEach(b => b.onclick = () => cambiar(a => { const n = a.find(x => x.id === b.dataset.mal); n.estado = "ok";
      return [...a, {id: Date.now().toString(36), t: n.t, texto: n.texto + " (sigue mal)", por: quien, fecha: new Date().toISOString(), ver: ver(it), estado: "pend"}]; }));
  } else if(S.sec === "tomas"){
    c.innerHTML = `<p class="sub" style="margin-bottom:8px">Tocá la toma que no te guste y elegí con qué reemplazarla.</p>` + lin.map((t,i) => `<div class="trow ${i in L.marc?"marcada":""}" data-k="${i}" data-t0="${t.t0}" data-t1="${t.t1}"><button class="tchip"><b>${tc(t.t0)}</b><small>${esc(t.frase||t.clip)}</small>${(t.clip||"").startsWith("PROPIO")?"<em>CREADORA</em>":""}</button></div>`).join("");
    c.querySelectorAll(".tchip").forEach(b => b.onclick = () => { const k = Number(b.parentElement.dataset.k); S.tomaAb = S.tomaAb === k ? null : k; const v = V(); if(v && S.tomaAb != null) v.currentTime = Number(lin[k].t0) + .05; pintarCuerpo(); });
    if(S.tomaAb != null && lin[S.tomaAb]){
      const k = S.tomaAb, t = lin[k], m = L.marc[k] || {}, row = c.querySelector(`.trow[data-k="${k}"]`);
      const cel = (a,j) => `<div class="alt ${m.clip===a.clip?"sel":""}" data-clip="${esc(a.clip)}" title="${esc(a.desc)}"><div class="th" style="background-image:url('${esc(it.tomasGrilla||"")}');background-size:288px auto;background-position:-${j*96}px -${(t.fila*170.4).toFixed(1)}px"></div><span>${(a.clip||"").startsWith("PROPIO")?'<b class="dc">DE LA CREADORA</b>':""}${esc((a.desc||"").slice(0,26))}</span></div>`;
      const panel = document.createElement("div"); panel.className = "tpanel";
      panel.innerHTML = `<div class="q">${tc(t.t0)}–${tc(t.t1)} · «${esc(t.frase||"")}»</div>
        <div class="alts">${(t.alts||[]).map(cel).join("")}<div class="alt sis ${(k in L.marc) && !m.clip?"sel":""}" data-clip="">Que elija el sistema</div></div>
        <input class="tnota" placeholder="Opcional: qué querés ver acá (ej. el frasco, una panza, sin cara)" value="${esc(m.nota||"")}">
        <div class="ac"><button class="btn dark ch tmarcar">${k in L.marc?"Actualizar":"Marcar para cambiar"}</button>${k in L.marc?'<button class="btn ch tquitar">Dejarla como está</button>':""}</div>`;
      row.appendChild(panel); row.scrollIntoView({block:"nearest"});
      let elegido = m.clip ?? null;
      panel.querySelectorAll(".alt").forEach(a => a.onclick = () => { panel.querySelectorAll(".alt").forEach(x=>x.classList.remove("sel")); a.classList.add("sel"); elegido = a.dataset.clip; });
      const listo = () => { S.tomaAb = null; document.activeElement?.blur(); pintarCuerpo(); pintarAcciones(); pintarFila(id); };
      panel.querySelector(".tmarcar").onclick = () => { L.marc[k] = {t: Number(t.t0) + 0.1, clip: elegido || "", nota: panel.querySelector(".tnota").value.trim()}; listo(); };
      const q = panel.querySelector(".tquitar"); if(q) q.onclick = () => { delete L.marc[k]; listo(); };
    }
  } else {
    c.innerHTML = `<p class="sub" style="margin-bottom:8px">${ed?"Tocá un subtítulo para corregirlo.":""}</p><div class="subs">${subs.map((t,i)=>`<label><span>${i+1}</span><input data-i="${i}" value="${esc(L.subs[i] ?? t)}" data-orig="${esc(t)}" class="${i in L.subs?"cambio":""}" ${ed?"":"disabled"}></label>`).join("")}</div>
      ${ed?`<label class="chk"><input type="checkbox" id="vBroll" ${L.broll?"checked":""}> Elegir todo el b-roll de nuevo</label>`:""}`;
    c.querySelectorAll(".subs input").forEach(i => i.oninput = () => { if(i.value !== i.dataset.orig) L.subs[i.dataset.i] = i.value; else delete L.subs[i.dataset.i]; i.classList.toggle("cambio", i.dataset.i in L.subs); pintarAcciones(); });
    const ob = $("#vBroll"); if(ob) ob.onchange = () => { L.broll = ob.checked; pintarAcciones(); };
  }
  $("#vForm").hidden = !ed;
  pintarPista();
}
function pintarFila(id){ const f = document.querySelector(`#tj-${CSS.escape(id)} .poster`); if(!f) return; const n = pend(items[id]).length + Object.keys(loc(id).marc).length; f.querySelector(".nn")?.remove(); if(n) f.insertAdjacentHTML("beforeend", `<i class="nn">${n}</i>`); }

function conectarForm(id){
  const tx = $("#vTexto"), g = $("#vGuardar"), bg = $("#vGeneral");
  const donde = () => { $("#vDondeL").textContent = S.general ? "Nota" : "Nota en"; $("#vDonde").textContent = S.general ? "general" : tc(S.tNota ?? V()?.currentTime ?? 0); bg.textContent = S.general ? "Clavarla en el segundo" : "Nota general"; };
  if(!V()) S.general = true;
  donde();
  tx.oninput = () => { if(S.tNota == null && V()){ S.tNota = V().currentTime; V().pause(); } g.disabled = !tx.value.trim(); donde(); };
  bg.onclick = () => { if(!V()) return; S.general = !S.general; donde(); tx.focus(); };
  const guardarNota = () => { const texto = tx.value.trim(), it = items[id]; if(!texto || !it) return;
    const n = {id: Date.now().toString(36), t: S.general ? null : Math.round((S.tNota ?? V()?.currentTime ?? 0) * 10) / 10, texto, por: quien, fecha: new Date().toISOString(), ver: ver(it), estado: "pend"};
    tx.value = ""; g.disabled = true; S.tNota = null; S.general = !V(); S.activa = n.id; S.sec = "notas"; donde();
    guardar(id, {notasT: [...notasT(it), n]}, "Nota guardada"); };
  $("#vForm").onsubmit = e => { e.preventDefault(); guardarNota(); };
  tx.onkeydown = e => { if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); guardarNota(); } if(e.key === "Escape") tx.blur(); };
}

function pintarAcciones(){
  const id = S.abierto, it = items[id], el = $("#vAcc"); if(!it || !el) return;
  if(el.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
  const L = loc(id), nN = pend(it).length, nT = Object.keys(L.marc).length, nS = Object.keys(L.subs).length, n = nN + nT + nS + (L.broll?1:0);
  const partes = [nN && `${nN} ${nN===1?"nota":"notas"}`, nT && `${nT} ${nT===1?"toma":"tomas"}`, nS && `${nS} ${nS===1?"subtítulo":"subtítulos"}`, L.broll && "todo el b-roll"].filter(Boolean).join(" · ");
  if(editable(it)){
    if(S.rech){
      el.innerHTML = `<input id="vMotivo" placeholder="¿Por qué no sirve el crudo? (audio cortado, mal grabado…)"><button class="btn ch" id="vRechNo">Cancelar</button><button class="btn dark ch" id="vRechSi">Rechazar el crudo</button>`;
      $("#vMotivo").focus();
      $("#vRechNo").onclick = () => { S.rech = false; document.activeElement?.blur(); pintarAcciones(); };
      $("#vRechSi").onclick = () => { const m = $("#vMotivo").value.trim(); if(!m){ toast("Escribí por qué no sirve el crudo"); return; } S.rech = false; cerrar(id, {estado:"rechazado", nota:m}, "Rechazado"); };
      return;
    }
    const rapido = nT && !nN && !nS && !L.broll;
    el.innerHTML = `<button class="btn link" id="vRech" title="Solo si hay que volver a grabarlo">Rechazar el crudo</button><span class="sp"></span>
      <button class="btn dark" id="vMandar" ${n?"":"disabled"}>Mandar correcciones${n?` (${n})`:""}</button><button class="btn ok" id="vAprobar">${n?"Aprobar igual":"Aprobar"}</button>
      <span class="res">${n ? `${partes} · ${rapido ? "solo se cambian esas tomas: vuelve en minutos" : "vuelve re-editado en ~20 min"}` : "Sin cambios pedidos. Si está bien, aprobalo: pasa a Editados y a la app."}</span>`;
    $("#vRech").onclick = () => { S.rech = true; pintarAcciones(); };
    $("#vAprobar").onclick = () => { if(n && !confirm(`Tiene ${partes} sin mandar: no se van a corregir. ¿Aprobar igual?`)) return; cerrar(id, {estado:"aprobado"}, "Aprobado: pasa a Editados y a la app"); };
    $("#vMandar").onclick = () => mandar(id, false);
  } else if(rehacible(it)){
    el.innerHTML = `<span class="res" style="flex-basis:auto">${n ? partes : "Para rehacerlo, dejá una nota o corregí un subtítulo."} · la app sigue con la versión aprobada hasta que apruebes la nueva.</span><span class="sp"></span><button class="btn dark" id="vRehacer" ${n?"":"disabled"}>Rehacer con esto</button>`;
    $("#vRehacer").onclick = () => { if(confirm("¿Rehacer este video? Vuelve a Para revisar en ~20 min.")) mandar(id, true); };
  } else if(it.estado === "error"){
    el.innerHTML = `<span class="sp"></span><button class="btn" id="vReint">Volver a intentar</button>`;
    $("#vReint").onclick = () => cerrar(id, {estado:"corregir", pedido:{}}, "Se vuelve a intentar");
  } else {
    const p = it.pedido || {};
    el.innerHTML = `<span class="res">${it.estado==="corregir" ? `Se está corrigiendo${p.tomas?.length ? `: ${p.tomas.length} ${p.tomas.length===1?"toma":"tomas"}` : p.nota ? `: ${esc(p.nota.slice(0,160))}` : ""}. Vuelve solo a Para revisar.` : it.estado==="procesando" ? "Se está editando. Aparece solo en Para revisar." : ""}</span>`;
  }
}

// Mismo contrato de siempre con el bot: solo tomas → {tomas} (cambia esas y vuelve en minutos); con notas, subtítulos o
// "todo el b-roll" → {pantallas, broll, nota} (re-edición). Las notas por segundo viajan en el texto como «seg 12,3: …».
function mandar(id, rehacer){
  const it = items[id], L = loc(id), ps = pend(it).sort((a,b) => (a.t ?? -1) - (b.t ?? -1));
  const tomas = Object.values(L.marc).map(m => ({t: m.t, ...(m.clip ? {clip: m.clip} : {}), ...(m.nota ? {nota: m.nota} : {})}));
  const enviadas = notasT(it).map(n => n.estado === "pend" ? {...n, estado: "env"} : n);
  if(!rehacer && tomas.length && !ps.length && !Object.keys(L.subs).length && !L.broll)
    return cerrar(id, {estado:"corregir", pedido:{tomas, por:quien}}, `Listo: se ${tomas.length===1?"cambia esa toma":"cambian esas "+tomas.length+" tomas"} y vuelve en unos minutos`);
  const pantallas = (it.pantallas||[]).map((t,i) => L.subs[i] ?? ((t && typeof t==="object") ? (t.texto||"") : t));
  const txt = ps.map(n => (n.t == null ? "" : `seg ${n.t.toFixed(1).replace(".",",")}: `) + n.texto).join(" | ");
  const extra = tomas.length ? "Cambiar las tomas de los seg " + tomas.map(m=>m.t.toFixed(1)+(m.nota?" ("+m.nota+")":"")).join(", ") : "";
  cerrar(id, {estado:"corregir", notasT: enviadas, pedido:{pantallas, broll: rehacer ? true : !!L.broll, nota: [txt, extra].filter(Boolean).join(" | "), por:quien, ...(rehacer?{rehacer:true}:{})}},
    rehacer ? "Listo: se rehace y vuelve a Para revisar en ~20 min" : "Listo: vuelve editado en ~20 min · la skill aprende de esto");
}
// guarda, limpia lo local de ese video y pasa al siguiente de la lista (para revisar de corrido)
async function cerrar(id, datos, msg){
  const sig = vecino(1) || vecino(-1);
  if(!await guardar(id, {...datos, revisadoPor:quien}, msg)) return;
  delete S.loc[id];
  if(S.abierto === id){ if(sig && items[sig]) abrir(sig); else cerrarVisor(); }
  pintar();
}

document.addEventListener("keydown", e => {
  if($("#app").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const v = V(), k = e.key;
  if(!S.abierto) return;
  if(k === "Escape"){ cerrarVisor(); return; }
  if(k === " " && v){ e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if(k === "ArrowLeft" && v){ e.preventDefault(); v.currentTime = Math.max(0, v.currentTime - 2); }
  else if(k === "ArrowRight" && v){ e.preventDefault(); v.currentTime = v.currentTime + 2; }
  else if(k === "ArrowDown" && vecino(1)){ e.preventDefault(); abrir(vecino(1)); }
  else if(k === "ArrowUp" && vecino(-1)){ e.preventDefault(); abrir(vecino(-1)); }
  else if((k === "n" || k === "N") && $("#vForm") && !$("#vForm").hidden){ e.preventDefault(); if(v){ v.pause(); S.general = false; S.tNota = v.currentTime; $("#vDonde").textContent = tc(S.tNota); } $("#vTexto").focus(); }
});

const DEMO = new URLSearchParams(location.search).has("demo");
if(quien && !DEMO) arrancar();
// para probar la página sin entrar (datos de mentira desde la consola)
window.__sala = {S, app: a => { S.app = a; pintar(); }, set: (q, its) => { quien = q; items = its; fb = {doc:(...a)=>a[2], updateDoc: async (id, d) => { items[id] = {...items[id], ...d}; setTimeout(pintar, 0); }}; $("#login").hidden = true; $("#app").hidden = false; pintar(); }};
</script>
