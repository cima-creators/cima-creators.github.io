<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Guiones Nala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: mesa de revisión a pantalla completa. Barra arriba, lista a la izquierda, el video de la referencia y, al lado,
   UNA sola tabla que se desplaza: cada tramo de la referencia con la fila nuestra que lo calca (en Formatos siguen los
   tres paneles: video · su guion · la plantilla). La decisión y las notas quedan fijas abajo.
   En pantallas angostas o bajas pasa a una columna con scroll de página y la lista se abre como cajón.
   Azul de lápiz de corrector para lo activo, resaltador amarillo para lo que se editó. */
:root{
  --bg:#F4F2EF;--surface:#FFFFFF;--raised:#FBFAF8;--sunken:#EFECE8;--line:#E7E2DC;--line-2:#D6CFC7;
  --ink:#1B1816;--ink-2:#4A443F;--ink-3:#847C74;--ink-4:#B3ABA2;
  --accent:#3D4EDB;--accent-soft:#ECEEFC;--on:#FFFFFF;
  --ok:#2F8660;--ok-soft:#E3F1EA;--warn:#A8721F;--warn-soft:#F7ECD6;--bad:#BD4F32;--bad-soft:#F8E4DC;--ia:#6D4FC2;--ia-soft:#EDE8FA;
  --hl:#FFF1B8;--hl-soft:#FFF8DC;--vid:#0E0D0C;
  --b1:#EADFD6;--b2:#D9E6DE;--b3:#F1E3C4;--b4:#DFDCF0;--b5:#F2D8CE;--b6:#D5E3EC;
  --sh-1:0 1px 2px rgba(27,24,22,.05);--sh-pop:0 14px 34px -10px rgba(27,24,22,.28),0 2px 6px rgba(27,24,22,.08);
  --ff:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110;--surface:#1A1817;--raised:#1F1D1B;--sunken:#272421;--line:#2D2A27;--line-2:#403B37;
  --ink:#F1ECE7;--ink-2:#CFC8C1;--ink-3:#9A9189;--ink-4:#6E665F;
  --accent:#8E9BFF;--accent-soft:#22254A;--on:#141312;
  --ok:#6CC49B;--ok-soft:#1B3327;--warn:#DDAA5C;--warn-soft:#382D18;--bad:#EA8C6B;--bad-soft:#3B2118;--ia:#B7A1FF;--ia-soft:#2A2446;
  --hl:#5A4C14;--hl-soft:#332C12;--vid:#000;
  --b1:#3A302A;--b2:#25362E;--b3:#3D3322;--b4:#2E2C40;--b5:#402A22;--b6:#23323B;
  --sh-1:0 1px 2px rgba(0,0,0,.3);--sh-pop:0 14px 34px -10px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110;--surface:#1A1817;--raised:#1F1D1B;--sunken:#272421;--line:#2D2A27;--line-2:#403B37;
  --ink:#F1ECE7;--ink-2:#CFC8C1;--ink-3:#9A9189;--ink-4:#6E665F;
  --accent:#8E9BFF;--accent-soft:#22254A;--on:#141312;
  --ok:#6CC49B;--ok-soft:#1B3327;--warn:#DDAA5C;--warn-soft:#382D18;--bad:#EA8C6B;--bad-soft:#3B2118;--ia:#B7A1FF;--ia-soft:#2A2446;
  --hl:#5A4C14;--hl-soft:#332C12;--vid:#000;
  --b1:#3A302A;--b2:#25362E;--b3:#3D3322;--b4:#2E2C40;--b5:#402A22;--b6:#23323B;
  --sh-1:0 1px 2px rgba(0,0,0,.3);--sh-pop:0 14px 34px -10px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

/* deslizadores */
.scroll{overflow:auto;scrollbar-gutter:stable}
.scroll::-webkit-scrollbar{width:12px;height:12px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);background-clip:content-box;border:3px solid transparent;border-radius:99px;min-height:36px}
.scroll::-webkit-scrollbar-thumb:hover{background-color:var(--ink-4)}
@supports not selector(::-webkit-scrollbar){.scroll{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}}

/* ---------- estructura general (base: una columna con scroll de página) ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding-left:var(--gl);padding-right:var(--gr);padding-block:0 16px}
.top{display:flex;align-items:center;gap:12px;min-height:56px;min-width:0;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:26px;height:26px;border-radius:8px;background:var(--ink);display:grid;place-items:center;flex:none}
.mark::before{content:"";width:13px;height:10px;background:var(--bg);clip-path:polygon(0 100%,36% 12%,54% 50%,68% 30%,100% 100%)}
.bname{font-weight:600;font-size:15px;letter-spacing:-.015em;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--sunken);border-radius:10px;padding:3px}
.tab{border:0;background:transparent;color:var(--ink-3);font-weight:500;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .12s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.tab b{font:500 11px var(--mono);color:var(--ink-3)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:18px;min-width:0}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog .pb{display:flex;width:120px;height:6px;border-radius:99px;overflow:hidden;background:var(--line)}
.prog .pb i{display:block;height:100%}
.pb .a{background:var(--ok)}.pb .c{background:var(--warn)}.pb .r{background:var(--bad)}
.prog b{color:var(--ink);font-weight:600}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ink-4);flex:none}
.sync.ok i{background:var(--ok)}.sync.off i{background:var(--warn)}.sync.busy i{background:var(--accent);animation:pulso 1s ease-in-out infinite}
@keyframes pulso{50%{opacity:.3}}
.menu{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;display:grid;place-items:center;flex:none}
.menu i,.menu i::before,.menu i::after{display:block;width:14px;height:1.6px;background:var(--ink);border-radius:2px;content:"";position:relative}
.menu i::before{position:absolute;top:-4.5px}.menu i::after{position:absolute;top:4.5px}

/* ---------- lista (cajón en una columna, panel fijo en pantalla completa) ---------- */
.side{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--sh-pop);
  position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(320px,88vw);border-radius:0 16px 16px 0;transform:translateX(-104%);transition:transform .2s ease;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.nav-open .side{transform:none}
.veil{position:fixed;inset:0;background:rgba(20,18,16,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.nav-open .veil{opacity:1;pointer-events:auto}
.side-h{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:8px;flex:none}
.search{position:relative}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--raised);padding:0 10px 0 31px;outline:0}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.search input::placeholder{color:var(--ink-3)}
.search::before{content:"";position:absolute;left:11px;top:10px;width:10px;height:10px;border:1.6px solid var(--ink-3);border-radius:50%;pointer-events:none;z-index:1}
.search::after{content:"";position:absolute;left:20px;top:21px;width:6px;height:1.6px;background:var(--ink-3);transform:rotate(45deg);border-radius:2px;pointer-events:none;z-index:1}
#filtros{display:grid;gap:6px}
.fil{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 6px;font-size:12px;min-width:0;max-width:100%;cursor:pointer}
.fest{display:flex;gap:4px}
.fe{flex:1 1 0;min-width:0;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:11.5px;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-variant-numeric:tabular-nums;padding:0 4px}
.fe:hover{border-color:var(--line-2);color:var(--ink)}
.fe.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.side-b{flex:1;min-height:0;padding:6px}
.grp{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:13px 8px 5px}
.grp:first-child{padding-top:6px}
.it{display:grid;grid-template-columns:36px minmax(0,1fr) 14px;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:9px;cursor:pointer;color:var(--ink-2);transition:background .1s}
.it:hover{background:var(--sunken)}
.it.on{background:var(--accent-soft);color:var(--ink)}
.it .cod{font:500 11px var(--mono);color:var(--ink-3)}
.it.on .cod{color:var(--accent)}
.it .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.it .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.st{display:block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-2);justify-self:center;flex:none}
.st.hecho{background:var(--accent);border-color:var(--accent)}
.st.aprobado{background:var(--ok);border-color:var(--ok)}.st.cambios{background:var(--warn);border-color:var(--warn)}.st.rechazado{background:var(--bad);border-color:var(--bad)}
.fe.on .st{border-color:currentColor}
.side-f{padding:9px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:none}
kbd{font:500 10.5px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 4px;color:var(--ink-2);background:var(--raised)}
.nada{padding:18px 12px;color:var(--ink-3);font-size:12.5px;text-align:center}

/* ---------- cabecera del ítem ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.head{display:grid;gap:7px;padding:0 2px;flex:none;min-width:0}
.h-row{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.h-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.code{font:500 12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 7px;flex:none}
h1{font-size:21px;font-weight:600;letter-spacing:-.022em;line-height:1.2;margin:0;text-wrap:balance;min-width:0}
.h-act{display:flex;align-items:center;gap:8px;flex:none}
.pill{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--sunken);color:var(--ink-3);white-space:nowrap}
.pill.hecho{background:var(--accent-soft);color:var(--accent)}
.pill.aprobado{background:var(--ok-soft);color:var(--ok)}.pill.cambios{background:var(--warn-soft);color:var(--warn)}.pill.rechazado{background:var(--bad-soft);color:var(--bad)}
.nav{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);height:30px;padding:0 2px}
.nav button{width:26px;height:24px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1;display:grid;place-items:center}
.nav button:hover:not(:disabled){background:var(--sunken)}
.nav button:disabled{opacity:.3;cursor:default}
.nav span{font:500 11.5px var(--mono);color:var(--ink-3);padding:0 5px}
.meta{display:flex;flex-wrap:wrap;gap:3px 0;font-size:12.5px;color:var(--ink-3);align-items:center}
.meta > * + *::before{content:"·";margin:0 8px;color:var(--ink-4)}
.meta b{color:var(--ink);font-weight:500}
.meta .mono{font-size:11.5px}
.lnk{border:0;background:none;padding:0;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.lnk:hover{color:var(--accent);text-decoration-color:var(--accent)}
.desc{font-size:13px;color:var(--ink-2);max-width:120ch;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.desc.open{-webkit-line-clamp:unset;display:block}
.tl{display:grid;gap:3px;margin-top:3px}
.tl-row{display:grid;grid-template-columns:74px minmax(0,1fr) 36px;gap:8px;align-items:center;font:500 10.5px var(--mono);color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.tl-row > b{font-weight:500;text-align:right;letter-spacing:0;font-variant-numeric:tabular-nums}
.tl-row > b.largo{color:var(--warn)}
.tl-bar{display:flex;gap:2px;height:20px;min-width:0}
.tl-bar span{min-width:3px;flex-basis:0;border-radius:5px;display:flex;align-items:center;padding:0 6px;font:500 11px var(--ff);letter-spacing:0;text-transform:none;color:var(--ink);white-space:nowrap;overflow:hidden}
.tl.una .tl-row{grid-template-columns:minmax(0,1fr)}
.tl.una .tl-bar{height:24px}

/* ---------- los tres paneles ---------- */
.ws{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh-1)}
.pane-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 0 12px;min-height:40px;border-bottom:1px solid var(--line);background:var(--raised)}
.pane-t{font-weight:600;font-size:12.5px;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pane-x{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;flex:none;max-width:72%}
.pane-x .num{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.pane-b{flex:1 1 auto;min-height:0;position:relative}
.pane-f{flex:none;border-top:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--raised)}
.xlink{color:var(--ink-3);text-decoration:none;font-size:11.5px;padding:4px 6px;border-radius:6px}
.xlink:hover{color:var(--accent);background:var(--accent-soft)}
.tg{border:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:11.5px;border-radius:7px;height:24px;padding:0 7px;cursor:pointer;flex:none}
.tg.on{background:var(--sunken);color:var(--ink);border-color:var(--line-2)}
.tagc{font:500 10.5px var(--mono);letter-spacing:.03em;padding:2px 7px;border-radius:6px;background:var(--ok-soft);color:var(--ok)}
.tagc.warn{background:var(--warn-soft);color:var(--warn)}

/* referencia */
.stage{background:var(--vid);display:grid;place-items:center;overflow:hidden;position:relative;aspect-ratio:9/16;width:100%;max-width:300px;margin:0 auto}
.stage.h{aspect-ratio:16/9;max-width:none}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:var(--vid)}
.stage .ph{color:#b5a79f;font-size:12.5px;text-align:center;padding:20px}
.stage .ph a{color:#f2ece7}
.zoomv{display:none;position:absolute;top:6px;right:6px;z-index:2;width:28px;height:28px;border:0;border-radius:8px;background:rgba(20,18,16,.62);color:#fff;place-items:center;cursor:pointer;padding:0}
.refs{flex:none;border-top:1px solid var(--line);padding:6px;display:grid;gap:2px}
.ref{display:grid;grid-template-columns:16px minmax(0,1fr);gap:9px;align-items:center;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;width:100%}
button.ref:hover{background:var(--sunken)}
.ref i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);display:block}
.ref.on i{border:4.5px solid var(--accent)}
.ref b{display:block;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref small{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ref.solo{grid-template-columns:minmax(0,1fr);cursor:default}

/* guion de la referencia */
.p-tr .pane-b{max-height:62vh}
.blk{display:flex;align-items:center;gap:8px;padding:12px 12px 4px;font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.blk i{width:8px;height:8px;border-radius:3px;flex:none}
.blk span{margin-left:auto;color:var(--ink-4);letter-spacing:0}
.seg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:7px 12px;cursor:pointer;transition:background .1s}
.seg:hover{background:var(--raised)}
.seg .t{font:400 11px var(--mono);color:var(--ink-4);padding-top:3px}
.seg .es{font-size:13.5px;line-height:1.5}
.seg .or{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.45}
.seg .ps{margin-top:5px;display:grid;gap:3px}
.seg .ps span{font-size:11.5px;color:var(--ink-3);padding-left:8px;border-left:2px solid var(--line-2);line-height:1.4}
.seg.lk{background:var(--hl-soft)}
.seg.act{background:var(--accent-soft)}
.seg.act .t{color:var(--accent)}
.no-orig .seg .or,.no-pant .seg .ps{display:none}
.mas{display:block;padding:0}
.mas summary{cursor:pointer;list-style:none;padding:9px 12px;font-weight:500;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
.mas summary::-webkit-details-marker{display:none}
.mas summary::after{content:"";width:6px;height:6px;border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);transform:rotate(-135deg);margin:3px 4px 0}
.mas[open] summary::after{transform:rotate(45deg);margin-top:-3px}
.mas-b{max-height:min(42vh,320px);padding:2px 12px 12px;color:var(--ink-2);font-size:12.5px}
.mas-b p{margin:0 0 10px;line-height:1.5;color:var(--ink)}
.mas-b dl{margin:0;display:grid;gap:6px}
.mas-b dl div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px}
.mas-b dt{color:var(--ink-3)}
.mas-b dd{margin:0}

/* nuestro guion */
.stabs{display:flex;gap:2px;margin-left:-6px;min-width:0}
.stabs button{border:0;background:none;font-size:12.5px;font-weight:500;color:var(--ink-3);padding:5px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.stabs button:hover{color:var(--ink)}
.stabs button.on{background:var(--sunken);color:var(--ink);font-weight:600}
.p-our{container-type:inline-size;container-name:our}
.g-h,.fila{display:grid;grid-template-columns:108px minmax(0,1fr) 32%}
:where(.sim) .g-h,:where(.sim) .fila{grid-template-columns:108px minmax(0,1fr)}
.g-h{position:sticky;top:0;z-index:2;background:var(--raised);border-bottom:1px solid var(--line);font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.g-h > div{padding:8px 12px}
.fila{border-bottom:1px solid var(--line);transition:background .15s}
.fila:last-child{border-bottom:0}
.fila > div{padding:14px 12px;min-width:0}
.fila.lk{background:var(--hl-soft)}

@container our (max-width:660px){

}

}
.ed{border-radius:5px;outline:0;overflow-wrap:anywhere;transition:background .12s,box-shadow .12s}

.ed[contenteditable="true"]:focus{background:var(--surface);box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--accent)}
.ed:empty::before{content:attr(data-ph);color:var(--ink-4)}
.ed.mod,.ed.mod[contenteditable="true"]:hover{background:var(--hl);box-shadow:0 0 0 4px var(--hl);color:var(--ink)}
.placa{display:inline-block;max-width:100%;background:var(--ink);color:var(--surface);font-weight:600;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.4;padding:4px 8px;border-radius:6px;margin-bottom:9px}
.placa[contenteditable="true"]:hover{background:var(--ink-2);box-shadow:none}
.placa[contenteditable="true"]:focus{background:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.placa.mod,.placa.mod[contenteditable="true"]:hover{background:var(--hl);color:var(--ink);box-shadow:none}
.placa:empty{background:transparent;color:var(--ink-4);text-transform:none;font-weight:400;letter-spacing:0;border:1px dashed var(--line-2);padding:3px 7px}
.fila:not(:hover) .placa:empty:not(:focus){display:none}
.filma{font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.chg{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.chg i{width:10px;height:10px;border-radius:3px;background:var(--hl);border:1px solid var(--line-2)}
.linkbtn{border:0;background:none;color:var(--ink-2);font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.linkbtn:hover{color:var(--accent)}
.est-r{display:grid;grid-template-columns:136px minmax(0,1fr);gap:14px;padding:13px 12px;border-bottom:1px solid var(--line)}
.est-r:last-child{border-bottom:0}
.est-r .n{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;font-weight:600;font-size:12.5px;align-items:start}
.est-r .n i{width:9px;height:9px;border-radius:3px;margin-top:4px}
.est-r .n small{display:block;font:400 11px var(--mono);color:var(--ink-3);margin-top:2px}
.est-r p{margin:0;font-size:13.5px;line-height:1.5}
.est-r p.ve{color:var(--ink-3);font-size:12.5px;margin-top:5px}
.rules{padding:14px 14px 18px;display:grid;gap:20px}
.rules h3{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.rules ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.45}
.rules li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:7px;justify-self:center}
.rules .no li::before{background:var(--bad);border-radius:1px;transform:rotate(45deg)}
.rules p{margin:0;font-size:13.5px;line-height:1.5}

/* ---------- referencia y nuestro guion, juntos y alineados ---------- */
.ws.uno .p-tr{display:none}
.c-h{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);position:sticky;top:0;z-index:3;height:32px;background:var(--raised);border-bottom:1px solid var(--line);font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.c-h > div{padding:0 12px;line-height:31px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-h > div + div{border-left:1px solid var(--line)}
.c-h b{font-weight:500;color:var(--ink)}
.sec{display:flex;align-items:center;gap:8px;min-height:32px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line);font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);position:sticky;top:32px;z-index:2}
.sec i{width:8px;height:8px;border-radius:3px;flex:none}
.sec span{color:var(--ink-4);letter-spacing:0}
.sec em{margin-left:auto;font:400 11.5px var(--ff);letter-spacing:0;text-transform:none;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.sec em.largo{color:var(--warn)}
.bd{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);border-bottom:1px solid var(--line);transition:background .15s}
.bd:last-child{border-bottom:0}
.bd-l{min-width:0;background:var(--raised);border-right:1px solid var(--line);padding:5px 0}
.bd-r{min-width:0;container-type:inline-size;container-name:our}
.bd .seg{padding:8px 12px}
.bd .seg:hover{background:var(--sunken)}
.bd .seg.rep{opacity:.55}
.bd .fila + .fila{border-top:1px dashed var(--line-2)}
.bd .fila{border-bottom:0;grid-template-columns:120px minmax(0,1fr) 32%}
:where(.sim) .bd .fila{grid-template-columns:120px minmax(0,1fr)}
.bd .fila > .et{padding-right:4px}
.bd .et b{overflow-wrap:break-word}
@container our (max-width:660px){.bd .fila{grid-template-columns:120px minmax(0,1fr)}}
@container our (max-width:440px){.bd .fila{grid-template-columns:minmax(0,1fr)}}
.bd.now{background:var(--accent-soft)}
.bd.now .bd-l{background:transparent}
.vac{padding:10px 12px;font-size:12px;line-height:1.45;color:var(--ink-3)}
.vac b{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.vac.warn b{color:var(--warn)}
.vac .ps{margin-top:5px;display:grid;gap:3px}
.vac .ps span{padding-left:8px;border-left:2px solid var(--line-2)}
.no-pant .vac .ps{display:none}
.antes{margin-top:9px;font-size:12px;line-height:1.45;color:var(--ink-3);padding-left:9px;border-left:2px solid var(--hl)}
.antes b{font-weight:500;color:var(--ink-2)}
/* nota por parte: pedir un cambio sin tener que escribir el texto nuevo */
.nb{display:inline-flex;margin-top:8px;border:0;background:none;padding:2px 0;font:500 11px var(--ff);color:var(--ink-4);cursor:pointer;border-radius:5px;white-space:nowrap}
.fila:hover .nb,.nb:hover,.nb:focus-visible{color:var(--accent)}
.pd{display:block;margin-top:10px;padding:6px 9px 7px;background:var(--surface);border:1px solid var(--line-2);border-left:2px solid var(--accent);border-radius:0 7px 7px 0}
.pd span{display:block;font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.pd textarea{display:block;width:100%;min-height:20px;border:0;outline:0;background:none;resize:none;overflow:hidden;font:400 13px/1.5 var(--ff);color:var(--ink);padding:0;field-sizing:content}
.pd textarea::placeholder{color:var(--ink-3)}
.pd:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* cambio hecho a partir de una nota: qué se pidió, qué se hizo y cómo decía antes */
.hc{margin-top:10px;padding:6px 9px 7px;background:var(--ok-soft);border-left:2px solid var(--ok);border-radius:0 7px 7px 0;font-size:12px;line-height:1.45;color:var(--ink-2)}
.hc > b{display:block;font:500 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ok);margin-bottom:2px}
.hc p{margin:0}
.hc p + p{margin-top:3px}
.hc i{font-style:normal;color:var(--ink-3)}
@container our (max-width:440px){.fila .nb{margin:-8px 0 -8px auto;padding:10px 0 10px 16px}}
.mas-b.suelto{max-height:none;padding:14px}
.stabs{overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
@container our (max-width:620px){
  .c-h{display:none}
  .sec{top:0}
  .bd{grid-template-columns:minmax(0,1fr)}
  .bd-l{border-right:0;border-bottom:1px dashed var(--line-2)}
  .bd-l::before{content:"Referencia";display:block;padding:5px 12px 0;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
  .p-our .pane-x > .tg,.p-our .pane-x .num,.p-our .pane-x .tagc:not(.warn){display:none}
}
/* «Solo guion»: lo que se dice de cada lado y nada más. «Con notas» trae el texto en pantalla, la toma y el porqué */
.modo{display:inline-flex;flex:none}
.p-our .pane-x{margin-left:auto;flex:0 1 auto}
.modo .tg:first-child{border-radius:7px 0 0 7px}
.modo .tg + .tg{border-radius:0 7px 7px 0;margin-left:-1px}
#tl .tl-row:last-child .tl-bar{height:10px}
#tl .tl-row:last-child .tl-bar span{font-size:0;padding:0;border-radius:4px}
.ng{border-bottom:1px solid var(--line);background:var(--raised)}
.ng dd.mono{font:400 11.5px var(--mono)}
.sim .bd .seg .ps,.sim .fila > .ve,.sim .g-h .h3,.sim .bd .tc,.sim .sec span,.sim .sec em:not(.largo),.sim .antes .porq{display:none}
.sim .p-our .pane-x > .tg,.sim .p-our .pane-x .num,.sim .p-our .pane-x .tagc:not(.warn){display:none}
/* de qué referencia sale el guion */
.ref em{display:inline-block;margin-top:4px;font:500 10px var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--on);background:var(--accent);border-radius:5px;padding:2px 6px;white-space:nowrap}
.ref em.pri{color:var(--ink-2);background:var(--sunken)}
/* ángulo, idea y citas del VOC */
.ctx{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:7px;max-width:100%;min-width:0;font-size:12.5px;line-height:1.35;padding:3px 9px 3px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.chip > i{font:500 10px var(--mono);font-style:normal;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);flex:none}
.chip b{font-weight:600}
.chip small{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.chip.ang{border-color:transparent}
.chip.ang > i{color:var(--ink-2)}
.it .nm small b{font-weight:400;color:var(--ink-4)}

/* ---------- barra de revisión ---------- */
.rev{flex:none;display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--sh-1);
  position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:20}
.dec{display:flex;gap:6px;flex:1 1 100%}
.dec .btn{flex:1 1 0;justify-content:center}
.btn{height:36px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:0 13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover:not(:disabled){background:var(--raised);border-color:var(--ink-4)}
.btn i{width:8px;height:8px;border-radius:50%;flex:none}
.btn.ok i{background:var(--ok)}.btn.warn i{background:var(--warn)}.btn.bad i{background:var(--bad)}
.btn.ok.on{background:var(--ok);border-color:var(--ok);color:var(--on)}
.btn.warn.on{background:var(--warn);border-color:var(--warn);color:var(--on)}
.btn.bad.on{background:var(--bad);border-color:var(--bad);color:var(--on)}
.btn.on i{background:currentColor}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface);height:32px;border-radius:8px}
.btn.pri:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn b{font:500 11px var(--mono);color:var(--ink-3)}
.btn .angosto{display:none}
.comp{flex:1 1 150px;min-width:0;display:flex;align-items:flex-end;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:1px 1px 1px 12px;transition:border-color .12s,box-shadow .12s}
.comp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.comp textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:0;font-size:13.5px;line-height:1.45;padding:6px 0;height:32px;max-height:132px;display:block}
.comp textarea::placeholder{color:var(--ink-3)}
.pop{position:absolute;right:8px;bottom:calc(100% + 8px);width:min(420px,calc(100% - 16px));max-height:min(440px,60vh);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--sh-pop);padding:6px;z-index:30;animation:sube .14s ease-out}
.pop-h{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 6px}
.nota{padding:9px 10px;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.nota + .nota{border-top:1px solid var(--line)}
.nota small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:normal}
.nota.vac{color:var(--ink-3)}
.toasts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:6px;z-index:60;pointer-events:none;justify-items:center}
.toast{background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:99px;box-shadow:var(--sh-pop);animation:sube .16s ease-out}
@keyframes sube{from{opacity:0;transform:translateY(6px)}}
.vacio{background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:center;padding:56px 20px;color:var(--ink-3)}
.vacio b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:6px}
.sk{min-height:260px;background:linear-gradient(100deg,var(--surface) 30%,var(--raised) 50%,var(--surface) 70%);background-size:300% 100%;animation:brilla 1.4s linear infinite}
@keyframes brilla{to{background-position:-150% 0}}

/* ---------- ganadores del día: tarjetas con el formato de la app de estáticos ---------- */
.gan{display:flex;flex-direction:column;gap:12px;min-height:0;flex:1 1 auto}
.gan-h{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:0 2px}
.gan-h p{margin:4px 0 0;color:var(--ink-3);font-size:13px;max-width:78ch}
.gtabs{display:flex;gap:2px;background:var(--sunken);border-radius:10px;padding:3px;flex:none}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));grid-auto-rows:max-content;gap:12px;align-content:start;min-height:0;flex:1 1 auto;padding:2px 2px 12px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-1)}
.gc-h{display:flex;align-items:center;gap:10px;padding:12px 12px 10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:15px;flex:none}
.who{min-width:0;flex:1}
.who b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b span{color:var(--ink-3);font-weight:400}

.who small i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.ext{color:var(--ink-3);display:grid;place-items:center;width:32px;height:32px;border-radius:9px;flex:none;text-decoration:none;font-size:15px}
.ext:hover{background:var(--sunken);color:var(--ink)}
.gc-img{display:block;flex:none;position:relative;border:0;padding:0;width:100%;aspect-ratio:4/5;background:var(--vid);cursor:pointer;overflow:hidden}
.gc-img img{width:100%;height:100%;object-fit:cover;display:block}
.gc-img .dur{position:absolute;left:8px;top:8px;background:rgba(20,18,16,.72);color:#fff;font:500 11px var(--mono);padding:3px 7px;border-radius:99px}
.gc-img::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(20,18,16,.6)}
.gc-img::before{content:"";position:absolute;left:50%;top:50%;z-index:1;margin:-8px 0 0 -5px;border-left:14px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.gc-b{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pl{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.pl.a{background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.pl.f{background:var(--b2);color:var(--ink)}
.pl.ok{background:var(--ok-soft);color:var(--ok)}
.pl.hoy{background:var(--accent);color:var(--on)}
/* color por grupo: verde = lo graba una creadora en su casa · ámbar = formato nuevo · violeta = animado con IA · gris = fundadora, detrás de escena */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-4)}
.dot.propios{background:var(--accent,#2563eb)}.dot.creadora{background:var(--ok)}.dot.otros{background:var(--warn)}.dot.ia{background:var(--ia)}.dot.marca{background:var(--ink-4)}
.pl.f{display:inline-flex;align-items:center;gap:6px;max-width:100%}.pl.f span{overflow:hidden;text-overflow:ellipsis}
.it.g{grid-template-columns:14px minmax(0,1fr) auto}.it.g .dot{justify-self:center}
.ggrp{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:14px 2px 0;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ggrp{white-space:nowrap}.ggrp:first-child{margin-top:2px}.ggrp small{font:400 12px var(--ff);letter-spacing:0;text-transform:none;color:var(--ink-3);white-space:normal;min-width:0}
.ggrp::after{content:"";flex:1;height:1px;background:var(--line)}
.gsec{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:6px 2px -4px;font-size:13.5px;font-weight:600;color:var(--ink)}
.gsec span{font:500 11px var(--mono);color:var(--ink-3)}
.gc h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.gc p{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gacc{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.gacc .btn{flex:1;justify-content:center;height:34px}
.btn.si{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.si:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
.btn.no{color:var(--bad)}

    (d.estado === 'descartada' ? '' : '<div><div class="lbl">Ángulos (vienen marcados los que le van; sale un guion por cada ✓)</div><div class="angs">' + todos.map(a => '<button class="ang' + (marcados.has(a) ? ' on' : '') + '" data-ang="' + esc(a) + '" aria-pressed="' + marcados.has(a) + '">' + esc(a) + '</button>').join('') + '</div><div class="angn" id="fx-angn"></div></div>' +
      '<div><div class="lbl">Tu pedido (opcional)</div><textarea id="fx-nota" placeholder="' + esc((S.paquete && S.paquete.pedido_ej) || 'Ej: con qué creadora, o qué detalle querés que tenga') + '">' + esc(d.nota || '') + '</textarea></div>') +
    '<div class="gacc">' + (d.estado === 'descartada' ? '<button class="btn" id="fx-volver">Volver a verla</button>' : '<button class="btn no" id="fx-no">No</button><button class="btn si" id="fx-si">' + (d.estado === 'elegir' ? 'La quiero' : 'Guardar') + '</button>') + '</div></div></div>';
  f.hidden = false;
  f.onclick = e => { if (e.target === f) cerrarFicha(); };
  $('#fx-x').onclick = cerrarFicha;
  f.querySelectorAll('[data-ang]').forEach(b => b.onclick = () => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); cuentaAng(); });
  const cuentaAng = () => { const n = f.querySelectorAll('.ang.on').length, e = $('#fx-angn'); if (e) e.textContent = n ? 'Marcados con ✓: ' + n + (n === 1 ? ' guion' : ' guiones') + '. Tocá uno para sacarlo o sumarlo.' : 'Ninguno marcado: tocá los que quieras.'; }; cuentaAng();
  const si = $('#fx-si'), no = $('#fx-no'), vo = $('#fx-volver');
  if (si) si.onclick = () => { const ang = [...f.querySelectorAll('.ang.on')].map(b => b.dataset.ang); if (!ang.length) { toast('Marcá al menos un ángulo'); return; }
    const c = {estado: d.estado === 'lista' ? 'lista' : 'elegida', para: {marca, angulos: ang}, nota: $('#fx-nota').value.trim(), elegidaEn: new Date().toISOString()}; cerrarFicha(); marcarGanador(id, c, 'Elegida: te la escribo para ' + CFG.cliente); };
  if (no) no.onclick = () => { cerrarFicha(); marcarGanador(id, {estado: 'descartada'}, 'Descartada'); };
  if (vo) vo.onclick = () => { cerrarFicha(); marcarGanador(id, {estado: 'elegir'}, 'Volvió a «Para elegir»'); };
}

/* ---------- eventos generales ---------- */
window.addEventListener('hashchange', () => { const a = S.tab + S.fmt + S.gui; if (leerHash() && a !== S.tab + S.fmt + S.gui) { S.gan = null; S.rtab = 'principal'; render(); } });
$('#t-ganadores').onclick = () => irGanadores();
$('#t-formatos').onclick = () => ir('formatos', S.fmt);
$('#t-guiones').onclick = () => ir('guiones', S.gui);
$('#q').oninput = e => { S.q = e.target.value; pintarLista(); if (S.tab === 'ganadores') pintarGanadores(); else pintarNav(); };
$('#menu').onclick = () => $('#app').classList.toggle('nav-open');
$('#veil').onclick = () => $('#app').classList.remove('nav-open');
document.addEventListener('click', () => abrirNotas(false));
document.addEventListener('keydown', e => {
  const t = e.target, escribe = t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if (e.key === 'Escape' && !$('#ficha').hidden) { cerrarFicha(); return; }
  if (e.key === 'Escape') { abrirNotas(false); $('#app').classList.remove('nav-open'); if (escribe) t.blur(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && t.id === 'nota') { e.preventDefault(); guardarNota(); return; }
  if (e.altKey && !e.metaKey && !e.ctrlKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); if (escribe) t.blur(); mover(e.key === 'ArrowDown' ? 1 : -1); }
});
/* ---------- clave de entrada ---------- */
const sal = t => 'sala-cima:' + String(t || '').trim().toLowerCase();
async function huella(t){   // la clave no va escrita en la página: se compara su huella
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sal(t))); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'd' + hash(sal(t)); }
}
const quienEntra = h => { const c = CFG.claves.find(c => c[0] === h || c[1] === h); return c ? (c[2] || '') : null; };   // null = clave incorrecta
const claveOk = h => quienEntra(h) !== null;
function arrancar(quien){
  S.solo = quien || ''; S.rol = (S.paquete && S.paquete.rol) || '';
  $('#app').classList.toggle('cli', S.cli && !esRevisor());
  if (S.solo) { $('.bname').textContent = CFG.cliente + ' · Guiones de ' + S.solo; let p = null; try { p = localStorage.getItem('sala-det'); } catch (e) {} if (p === null) S.det = true; }   // la creadora abre con todo lo que tiene que filmar
  $('#gate').hidden = true; $('#app').hidden = false; cargar();
}
/* versión cifrada: la clave no se compara con nada escrito en la página; de ella salen el nombre del paquete y la llave que lo abre */
const deB64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0)), aB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const norma = t => String(t || '').trim().toLowerCase();
async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function llaveDe(clave){
  const enc = new TextEncoder(), base = await crypto.subtle.importKey('raw', enc.encode(norma(clave)), 'PBKDF2', false, ['deriveKey']);
  const salt = (await crypto.subtle.digest('SHA-256', enc.encode('sala-cima:sal:' + norma(clave)))).slice(0, 16);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
async function abrirPaquete(id, llave){   // null si esa clave no tiene paquete o no lo abre
  try { const r = await fetch('d/' + id + '.json', {cache: 'no-store'}); if (!r.ok) return null;
    const p = await r.json(), claro = await crypto.subtle.decrypt({name: 'AES-GCM', iv: deB64(p.i)}, llave, deB64(p.c));
    return JSON.parse(new TextDecoder().decode(claro)); } catch (e) { return null; }
}
async function entrarCifrado(clave){
  const id = (await sha('sala-cima:id:' + norma(clave))).slice(0, 20), llave = await llaveDe(clave), p = await abrirPaquete(id, llave);
  if (!p) return false;
  try { localStorage.setItem('sala-llave', id + '.' + aB64(await crypto.subtle.exportKey('raw', llave))); } catch (e) {}
  S.paquete = p; arrancar(p.quien); return true;
}
async function recordarCifrado(){   // en este dispositivo ya se entró: se abre con la llave guardada
  let g = ''; try { g = localStorage.getItem('sala-llave') || ''; } catch (e) {}
  const [id, k] = g.split('.'); if (!id || !k) return false;
  try { const llave = await crypto.subtle.importKey('raw', deB64(k), {name: 'AES-GCM'}, true, ['decrypt']), p = await abrirPaquete(id, llave);
    if (!p) return false; S.paquete = p; arrancar(p.quien); return true; } catch (e) { return false; }
}
function pedirClave(){
  const g = $('#gate'), inp = $('#clave'); g.hidden = false;
  if (CFG.cifrado) { g.onsubmit = async e => { e.preventDefault(); const b = g.querySelector('button'); b.disabled = true; const ok = await entrarCifrado(inp.value).catch(() => false); b.disabled = false; if (!ok) { $('#gate-e').hidden = false; inp.select(); } }; setTimeout(() => inp.focus(), 50); return; }
  g.onsubmit = async e => { e.preventDefault(); const h = await huella(inp.value), h2 = 'd' + hash(sal(inp.value)), ok = claveOk(h) ? h : claveOk(h2) ? h2 : '';
    if (ok) { try { localStorage.setItem('sala-clave', ok); } catch (err) {} arrancar(quienEntra(ok)); } else { $('#gate-e').hidden = false; inp.select(); } };
  setTimeout(() => inp.focus(), 50);
}
(() => {
  if (S.cli) { $('.bname').textContent = $('#gate-t').textContent = CFG.cliente + ' · Guiones'; $('#t-formatos').hidden = true; }
  if (CFG.cifrado) { recordarCifrado().then(ok => { if (!ok) pedirClave(); }); return; }
  let g = ''; try { g = localStorage.getItem('sala-clave') || ''; } catch (e) {}
  if (!CFG.claves.length || (g && claveOk(g))) arrancar(quienEntra(g)); else pedirClave();
})();
</script>
