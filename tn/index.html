<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>CIMA · Conectar Tienda Nube</title>
<style>
:root{--bg:#F7F6F3;--tx:#1d1d1f;--mu:#6b6b70;--ok:#2f7a4a;--no:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--tx:#f2f2f2;--mu:#a5a5ad}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
.c{max-width:420px}h1{font-size:1.5rem;margin:0 0 10px}p{color:var(--mu);line-height:1.5}.ok{color:var(--ok)}.no{color:var(--no)}
</style></head><body><div class="c">
<h1 id="t">Conectando tu tienda…</h1><p id="p">No cierres esta página.</p>
</div>
<script>
(async function(){
  const code = new URLSearchParams(location.search).get('code');
  const t = document.getElementById('t'), p = document.getElementById('p');
  if (!code) { t.textContent = 'Falta el código'; p.textContent = 'Volvé a abrir el link de autorización que te pasamos.'; return; }
  try {
    const r = await fetch('https://us-central1-cleargy-creators.cloudfunctions.net/canje', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ accion:'tn_conectar', code }) });
    const d = await r.json();
    if (d.ok) { t.textContent = '¡Listo! Tienda conectada ✅'; t.className = 'ok'; p.textContent = (d.tienda ? d.tienda + ' quedó' : 'Tu tienda quedó') + ' conectada con CIMA. Ya podés cerrar esta página.'; }
    else { t.textContent = 'No se pudo conectar'; t.className = 'no'; p.textContent = (d.error || 'Error') + '. Avisanos y te pasamos un link nuevo.'; }
  } catch (e) { t.textContent = 'No se pudo conectar'; t.className = 'no'; p.textContent = 'Revisá tu conexión y volvé a abrir el link de autorización.'; }
})();
</script></body></html>
