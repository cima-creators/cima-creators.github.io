<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Variantes de ganadores · CIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif}
:root{--bg:#FAF7F4;--card:#FFFFFF;--soft:#F6F2EE;--line:#EFE8E3;--line2:#E2D8D1;--txt:#26211E;--mut:#8A7E77;--mut2:#B5A79F;
  --ok:#3F8F6B;--ok-bg:#E7F2EC;--warn:#B07B2E;--warn-bg:#F7EEDD;--bad:#C1613C;--bad-bg:#F8E7DF;--r:22px}
body{background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding:28px 22px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:10px 17px;border-radius:14px;font-weight:600;font-size:13px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--line2)}
.btn.dark{background:var(--txt);color:#fff;border-color:var(--txt)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.marcas{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.mt{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:13px;padding:8px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.mt.on{background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(38,33,30,.08)}
.mt b{display:inline-block;margin-left:7px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600}
.top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,2fr);gap:11px;margin-bottom:18px}
@media (max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
.hero{border-radius:26px;padding:22px 24px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#51463F 0%,#26211E 64%);display:flex;align-items:center;gap:20px;min-height:200px}
.hero .blob{position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.06);right:-80px;bottom:-100px}
.ringbox{position:relative;width:112px;height:112px;flex-shrink:0}
.ringbox svg{transform:rotate(-90deg);display:block}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .mid b{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.03em}
.ringbox .mid u{text-decoration:none;font-size:10.5px;opacity:.75;margin-top:3px}
.hero-msg{position:relative;min-width:0}
.hero-msg .ey{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.6}
.hero-msg h3{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.025em;margin:6px 0 7px;color:#fff;text-transform:none}
.hero-msg p{font-size:12.5px;line-height:1.55;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-height:94px;display:flex;flex-direction:column;cursor:pointer;text-align:left;transition:border-color .15s}
.kpi:hover{border-color:var(--line2)}
.kpi.on{border-color:var(--txt);box-shadow:0 0 0 1px var(--txt)}
.kpi .l{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.035em;margin-top:auto;padding-top:8px;line-height:1}
.kpi.alerta .v{color:var(--warn)} .kpi.mal .v{color:var(--bad)}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.cab{display:flex;align-items:center;gap:10px;padding:12px 14px}
.cab .av{width:34px;height:34px;border-radius:50%;background:var(--txt);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.cab .t{min-width:0;flex:1}
.cab .t b{display:block;font-size:13.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cab .t small{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11.5px}
.cab .t small i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.cab .t small i.ok{background:var(--ok)} .cab .t small i.mal{background:var(--bad)}
.cab a{color:var(--mut);font-size:15px;text-decoration:none}
.vid{height:300px;background:var(--soft);position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vid img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
.vid .play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(38,33,30,.82);display:grid;place-items:center}
.vid .play:after{content:"";border-left:17px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.vid .tag{position:absolute;left:10px;bottom:10px;background:rgba(38,33,30,.78);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
.vid .marco{position:relative;height:100%;aspect-ratio:9/16;overflow:hidden;background:#1d1916}
.vid .marco iframe{position:absolute;top:0;left:-6%;width:112%;height:100%;border:0}
.vid.img .marco{aspect-ratio:4/5}
.vid .ph{color:var(--mut2);font-size:12.5px;text-align:center;padding:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.pill{display:inline-block;font-size:11.5px;font-weight:500;padding:4px 11px;border-radius:99px;background:var(--soft);color:var(--mut)}
.pill.m{background:var(--txt);color:#fff}
.pill.e-revisar{background:var(--warn-bg);color:var(--warn)}
.pill.e-error,.pill.e-rechazado{background:var(--bad-bg);color:var(--bad)}
.pill.e-subido,.pill.e-aprobado{background:var(--ok-bg);color:var(--ok)}
.links{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.links a{color:var(--txt);font-weight:500}
h3{margin:4px 0 8px;font-size:10.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.subs{max-height:400px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.subs label{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:4px;padding:3px 8px;border-top:1px solid var(--line)}
.subs label:first-child{border-top:0}
.subs span{color:var(--mut2);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.subs input{width:100%;border:1px solid transparent;background:transparent;color:var(--txt);font-size:13.5px;padding:7px 9px;border-radius:10px}
.subs input:focus{outline:none;border-color:var(--line2);background:var(--soft)}
.cambio{background:var(--warn-bg)!important;color:var(--warn)!important}
.nota{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:13.5px;background:var(--card);color:var(--txt);resize:vertical}
.nota:focus{outline:none;border-color:var(--line2)}
.chk{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--mut);margin-top:9px}
.acciones{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:auto;padding-top:6px}
.acciones .btn{padding:9px 10px;min-height:38px;font-size:12.5px;border-radius:12px}
.editor{display:none;flex-direction:column;gap:6px}
.editor.on{display:flex}
.editor .texto{font-size:13px;padding:9px 11px}
.editor .nota{font-size:12.5px;padding:9px 11px}
.ayuda{font-size:12px;color:var(--mut2);margin-top:8px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:8px 10px;font-size:11.5px;white-space:pre-wrap;max-height:90px;overflow:auto}
.hist{font-size:11.5px;color:var(--mut);background:var(--soft);border-radius:12px;padding:7px 10px}
.vacio{text-align:center;color:var(--mut);padding:60px 20px;background:var(--card);border:1px dashed var(--line2);border-radius:var(--r)}
#login{max-width:360px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
#login h1{font-size:23px}
#login input{width:100%;margin:16px 0 10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:15px;background:var(--soft);color:var(--txt)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--txt);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.cuerpo{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.cambio-t{font-size:13.5px;font-weight:600;line-height:1.3}
.txt{font-size:12.5px;color:var(--mut);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dato{font-size:12px;color:var(--mut)}
.dato b{font-size:10.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;display:block;margin-bottom:2px}
.texto{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:15px;font-weight:600;background:var(--card);color:var(--txt)}
.texto:focus{outline:none;border-color:var(--line2);background:var(--soft)}
.grupo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0 12px}
.grupo h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
.grupo a{color:var(--mut);font-size:12.5px}
.pill.roas{background:var(--ok-bg);color:var(--ok);font-weight:600}
</style>
</head>
<body>
<div id="login">
  <h1>Variantes de ganadores</h1>
  <p class="sub">Entrá con tu clave.</p>
  <input id="clave" type="password" placeholder="Clave" autocomplete="current-password">
  <button class="btn dark" id="entrar" style="width:100%">Entrar</button>
  <p id="login-e" class="sub" style="color:var(--bad)"></p>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <div><h1>Variantes de ganadores</h1><div class="sub" id="resumen">Cargando…</div></div>
    <button class="btn" id="salir">Salir</button>
  </header>
  <div class="marcas" id="marcas"></div>
  <div class="top"><div class="hero" id="hero"></div><div class="kpis" id="tabs"></div></div>
  <div id="lista"></div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
// Bot 5 (9/10/2026): a la 1:00 la marca manda los anuncios con ROAS >= 3 del día; la Mac de CIMA
// (creativos/variantes/variantes.py) genera 3-5 variantes de cada uno y las deja acá. Aprobada → Drive de la marca.
const CLAVES = {"vane-2026":"Vane","cima-2026":"Nacho","abril-2026":"Abril"};
const $ = s => document.querySelector(s);
const ESTADOS = [["revisar","Para revisar"],["procesando","Generándose"],["corregir","Corrigiéndose"],["subido","Aprobadas"],["rechazado","Descartadas"],["error","Con error"]];
const TIPO = {estatico:"Estático", video:"Video", animado:"Animado"};
let quien = null, items = {}, filtro = "revisar", fb = null, pendiente = false;
let marcaF = new URLSearchParams(location.search).get("marca") || (()=>{ try { return localStorage.getItem("variantes_marca") } catch(e){ return null } })() || "todas";
try { quien = CLAVES[localStorage.getItem("revision_clave")] || null; } catch(e) {}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),2200); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function entrar(){
  const k = $("#clave").value.trim();
  if(!CLAVES[k]){ $("#login-e").textContent = "Esa clave no es. Probá de nuevo."; return; }
  try { localStorage.setItem("revision_clave", k); } catch(e) {}
  quien = CLAVES[k]; arrancar();
}
$("#entrar").addEventListener("click", entrar);
$("#clave").addEventListener("keydown", e => { if(e.key==="Enter") entrar(); });
$("#salir").addEventListener("click", () => { try { localStorage.removeItem("revision_clave"); } catch(e) {} location.reload(); });

async function arrancar(){
  $("#login").hidden = true; $("#app").hidden = false;
  const [{initializeApp},{getFirestore,collection,doc,onSnapshot,updateDoc},{getAuth,signInAnonymously}] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js")]);
  const app = initializeApp({apiKey:"AIzaSyCTv4DiRCpbCpGYP6E86TPHlkPvaAZTN3g",authDomain:"cleargy-creators.firebaseapp.com",projectId:"cleargy-creators",storageBucket:"cleargy-creators.firebasestorage.app",messagingSenderId:"313543582398",appId:"1:313543582398:web:99fe78991adeea2e7cb4ef"});
  await signInAnonymously(getAuth(app));
  const db = getFirestore(app);
  fb = {db, doc, updateDoc};
  onSnapshot(collection(db,"variantes_cola"), snap => {
    snap.docChanges().forEach(c => { if(c.type==="removed") delete items[c.doc.id]; else items[c.doc.id] = c.doc.data(); });
    pintar();
  }, err => { $("#resumen").textContent = "No se pudo leer la cola: " + err.message; });
}

const fdia = f => (f||"").slice(0,10).split("-").reverse().slice(0,2).join("/");
const num = n => Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:0});

function pintar(){
  const todos = Object.entries(items);
  const marcas = [...new Set(todos.map(([,it])=>it.marca))].sort(); const nom = m => (todos.find(([,it])=>it.marca===m)||[,{}])[1].marcaNombre||m;
  const deMarca = todos.filter(([,it]) => marcaF==="todas" || it.marca===marcaF);
  const cuenta = e => deMarca.filter(([,it])=>it.estado===e).length;
  const hora = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  $("#resumen").textContent = `Hola ${quien} · actualizado ${hora} · datos en vivo`;
  const ultima = deMarca.map(([,it])=>it.fecha||"").sort().pop() || "";
  const delDia = deMarca.filter(([,it]) => it.fecha===ultima);
  const listos = delDia.filter(([,it]) => ["subido","aprobado","rechazado"].includes(it.estado)).length;
  const ganadores = new Set(delDia.map(([,it])=>it.marca+it.clave)).size;
  const total = delDia.length, pct = total ? Math.round(listos/total*100) : 0, R = 48, C = 2*Math.PI*R;
  const pend = cuenta("revisar"), enCurso = cuenta("procesando")+cuenta("corregir");
  $("#hero").innerHTML = `<div class="blob"></div>
    <div class="ringbox"><svg width="112" height="112"><circle cx="56" cy="56" r="${R}" stroke="rgba(255,255,255,.14)" stroke-width="9" fill="none"/>
      <circle cx="56" cy="56" r="${R}" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
      <div class="mid"><b>${pct}%</b><u>revisado</u></div></div>
    <div class="hero-msg"><div class="ey">${marcaF==="todas"?"Todas las marcas":esc(nom(marcaF))} · ganadores del ${fdia(ultima)||"—"}</div>
      <h3>${ganadores} ${ganadores===1?"ganador":"ganadores"} · ${listos} de ${total} variantes revisadas</h3>
      <p>${pend?`<b>${pend} ${pend===1?"espera":"esperan"} tu revisión.</b> `:"No hay nada esperando. "}${enCurso?`${enCurso} ${enCurso===1?"se está generando":"se están generando"}.`:""}${cuenta("error")?` ${cuenta("error")} con error.`:""}</p></div>`;
  const cls = e => e==="revisar"&&cuenta(e)?"alerta":e==="error"&&cuenta(e)?"mal":"";
  $("#tabs").innerHTML = ESTADOS.map(([e,t]) => `<button class="kpi ${cls(e)} ${e===filtro?"on":""}" data-e="${e}"><span class="l">${t}</span><span class="v">${cuenta(e)}</span></button>`).join("");
  if(marcaF!=="todas" && !marcas.includes(marcaF) && marcas.length) marcaF = "todas";
  const porRevisar = m => todos.filter(([,it]) => (m==="todas"||it.marca===m) && it.estado==="revisar").length;
  $("#marcas").innerHTML = ["todas",...marcas].map(m=>`<button class="mt ${m===marcaF?"on":""}" data-m="${m}">${m==="todas"?"Todas las marcas":esc(nom(m))}${porRevisar(m)?`<b>${porRevisar(m)}</b>`:""}</button>`).join("");
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{filtro=b.dataset.e;pintar();});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{marcaF=b.dataset.m; try{localStorage.setItem("variantes_marca",marcaF)}catch(e){} pintar();});
  const lista = deMarca.filter(([,it])=>it.estado===filtro)
    .sort((a,b)=>(b[1].fecha||"").localeCompare(a[1].fecha||"") || ((b[1].metricas||{}).ganancia||0)-((a[1].metricas||{}).ganancia||0) || (a[1].clave||"").localeCompare(b[1].clave||"") || (a[1].n||0)-(b[1].n||0));
  if(!lista.length){ $("#lista").innerHTML = `<div class="vacio">${filtro==="revisar"?"No hay variantes para revisar. Las de los ganadores de ayer aparecen solas desde la 1:30.":"Nada por acá."}</div>`; return; }
  // si está escribiendo una corrección, no le borramos lo que tipeó: se repinta cuando suelta
  const editando = document.querySelectorAll("#lista .cambio").length || (document.activeElement && document.activeElement.closest("#lista input, #lista textarea"));
  if(editando){ pendiente = true; return; }
  pendiente = false;
  let html = "", grupo = "";
  for(const [id,it] of lista){
    const g = (it.fecha||"")+"|"+it.marca+"|"+it.clave;
    if(g!==grupo){ if(grupo) html += "</div>"; grupo = g; const m = it.metricas||{};
      const link = it.permalink ? (it.permalink.startsWith("/")?"https://www.facebook.com"+it.permalink:it.permalink) : "";
      html += `<div class="grupo"><h2>${esc(it.adNombre||it.codigo||it.adId)}</h2>
        <span class="pill roas">ROAS ${Number(m.roas||0).toFixed(2)}</span><span class="pill">${num(m.compras)} compras</span>
        <span class="pill">Gasto ${num(m.gasto)} ${esc(it.moneda||"")}</span><span class="pill">Facturó ${num(m.facturacion)} ${esc(it.moneda||"")}</span>
        <span class="pill">Ganó el ${fdia(it.fecha)}</span>${link?`<a href="${esc(link)}" target="_blank" rel="noopener">ver el original ↗</a>`:""}</div><div class="grilla">`; }
    html += tarjeta(id,it);
  }
  if(grupo) html += "</div>";
  $("#lista").innerHTML = html;
  lista.forEach(([id]) => conectar(id));
}
document.addEventListener("focusout", () => setTimeout(() => { if(pendiente && !document.querySelector("#lista .cambio")) pintar(); }, 200));

function tarjeta(id,it){
  const esImg = /\.(png|jpe?g|webp)$/i.test(it.archivo||"") || it.tipo==="estatico";
  const editable = it.estado==="revisar";
  const m = it.metricas||{};
  const media = it.driveId
    ? `<img src="https://drive.google.com/thumbnail?id=${esc(it.driveId)}&sz=w600" alt="" loading="lazy" onerror="this.style.display='none'">${esImg?"":`<span class="play"></span>`}<span class="tag">${esc(TIPO[it.tipo]||it.tipo)}</span>`
    : `<div class="ph">${it.estado==="error"?"No salió":it.estado==="revisar"?"Subiendo a Drive…":"Generándose…"}</div>`;
  const punto = it.estado==="subido"||it.estado==="aprobado" ? "ok" : it.estado==="error"||it.estado==="rechazado" ? "mal" : "";
  return `<div class="item" id="it-${esc(id)}">
    <div class="cab"><div class="av">V${esc(it.n)}</div>
      <div class="t"><b>${esc(it.codigo||it.adNombre||"Variante")}${it.version>1?` · v${esc(it.version)}`:""}</b>
        <small><i class="${punto}"></i>${esc((ESTADOS.find(e=>e[0]===it.estado)||[,it.estado])[1])} · ${esc(TIPO[it.tipo]||it.tipo)}</small></div>
      ${it.driveId?`<a href="https://drive.google.com/file/d/${esc(it.driveId)}/view" target="_blank" rel="noopener" title="Abrir en Drive">↗</a>`:""}</div>
    <div class="vid ${esImg?"img":""}" data-drive="${esc(it.driveId||"")}">${media}</div>
    <div class="cuerpo">
      <div class="pills"><span class="pill roas">ROAS ${Number(m.roas||0).toFixed(2)}</span><span class="pill">${num(m.compras)} compras</span><span class="pill">V${esc(it.n)}</span></div>
      <div class="cambio-t">${esc(it.cambio)}</div>
      <div class="txt">"${esc(it.texto)}"</div>
      ${it.voz?`<div class="dato">Voz: "${esc(it.voz)}"</div>`:""}
      ${it.ganoCon?`<div class="dato">Ganó con: "${esc(it.ganoCon)}"</div>`:""}
      ${it.error?`<div class="err">${esc(it.error)}</div>`:""}
      ${it.qa?`<div class="err">Revisión automática: ${esc(it.qa)}</div>`:""}
      ${(it.notas||[]).length?`<div class="hist">Correcciones: ${(it.notas||[]).map(n=>esc(String(n).replace(/^Rehacé SOLO[^)]*\), con el mismo tipo de cambio\. ?/,""))).join(" · ")}</div>`:""}
      ${editable?`
      <div class="editor">
        <input class="texto" value="${esc(it.texto)}" data-orig="${esc(it.texto)}" title="${it.tipo==="animado"?"Verso del hook":"Texto nuevo"}">
        <textarea class="nota" rows="2" placeholder="Qué cambiar: el texto tapa la uña · otra toma para arrancar…"></textarea>
        <button class="btn dark corregir" disabled>Mandar corrección</button>
      </div>
      <div class="acciones">
        <button class="btn ok aprobar">Aprobar</button>
        <button class="btn abrir-ed">Corregir</button>
        <button class="btn no rechazar" title="Descartar">✕</button>
      </div>`:""}
      ${it.estado==="error"?`<div class="acciones" style="grid-template-columns:1fr"><button class="btn reintentar">Volver a intentar</button></div>`:""}
    </div></div>`;
}

function conectar(id){
  const el = document.getElementById("it-"+id); if(!el) return;
  const corr = el.querySelector(".corregir"), nt = el.querySelector(".nota"), tx = el.querySelector(".texto");
  const hayCambios = () => (tx && tx.value.trim()!==tx.dataset.orig) || (nt && nt.value.trim());
  nt && nt.addEventListener("input", () => { nt.classList.toggle("cambio", !!nt.value.trim()); corr.disabled = !hayCambios(); });
  tx && tx.addEventListener("input", () => { tx.classList.toggle("cambio", tx.value.trim()!==tx.dataset.orig); corr.disabled = !hayCambios(); });
  el.querySelector(".abrir-ed")?.addEventListener("click", () => { el.querySelector(".editor").classList.toggle("on"); tx?.focus(); });
  const vd = el.querySelector(".vid");
  vd.addEventListener("click", () => { const d = vd.dataset.drive; if(!d || vd.querySelector("iframe")) return;
    vd.innerHTML = `<div class="marco"><iframe src="https://drive.google.com/file/d/${d}/preview" allow="autoplay"></iframe></div>`; });
  const ref = fb.doc(fb.db,"variantes_cola",id);
  const marcar = async (datos,msg) => { try { await fb.updateDoc(ref,{...datos,revisadoPor:quien,actualizado:new Date().toISOString()}); toast(msg);
      el.querySelectorAll(".cambio").forEach(i=>i.classList.remove("cambio")); document.activeElement?.blur(); pintar(); } catch(e){ toast("No se pudo guardar: "+e.message); } };
  el.querySelector(".aprobar")?.addEventListener("click", () => marcar({estado:"aprobado"}, "Aprobada: pasa al Drive de la marca"));
  corr?.addEventListener("click", () => marcar({estado:"corregir", pedido:{texto:(tx?tx.value.trim():""), nota:(nt?nt.value.trim():"")}}, "Listo: vuelve corregida en ~30 min"));
  el.querySelector(".rechazar")?.addEventListener("click", () => marcar({estado:"rechazado", nota:(nt?nt.value.trim():"")}, "Descartada"));
  el.querySelector(".reintentar")?.addEventListener("click", () => marcar({estado:"corregir", pedido:{}}, "Se vuelve a intentar"));
}

if(quien) arrancar();
</script>
</body>
</html>
